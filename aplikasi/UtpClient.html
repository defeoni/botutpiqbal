<script>
(function () {
  'use strict';
  let preview = window.UTP_FRONTEND_PREVIEW === true;

  const classes = { BRANDED: 'Bermerek', GENERIC: 'Generik terkonfirmasi', UNKNOWN: 'Merek belum diketahui', OWNER: 'By Owner', OTHER: 'By Other' };
  const decisions = { PENDING: 'Belum diinput', APPROVED: 'Disetujui', REJECTED: 'Ditolak', DEFERRED: 'Ditunda' };
  const pages = { CATALOG: 'Katalog Material', APPROVALS: 'Persetujuan Material', REQUESTS: 'Permintaan & Review', ARRIVAL: 'Barang Datang' };
  const contractNotice = 'Workflow Material dinonaktifkan atau data ini memakai kontrak lama. Data tetap dapat dibaca.';
  let epoch = 0, sequence = 0, timer, toastTimer, modal = null, pendingDashboardRecord = '';
  let state = freshState();
  function freshState() {
    return { page: 'CATALOG', data: null, loading: false, error: '', editor: null,
      catalog: { query: '', brandClass: 'ALL', brand: '', typeQuery: '', group: '', approvedOnly: false, favoriteOnly: false, sortBy: '', sortDirection: 'asc', brands: [], items: [], total: 0, offset: 0, loading: false, error: '' }, approvalQuery: '', requestQuery: '', requestView: 'board', boardPages: {}, boardBusy: false };
  }
  const clone = value => JSON.parse(JSON.stringify(value));
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const el = id => document.getElementById(id);

  const activeProject = () => window.ProjectWorkspace ? window.ProjectWorkspace.getActiveId() : 'all';
  function projectMatches(record) { const project=activeProject();return project==='all'||(record.projectId||'legacy')===project; }
  function newProjectId() { const project=activeProject();if(window.ProjectWorkspace&&project==='all')throw new Error('Pilih satu proyek sebelum membuat dokumen material baru.');return project==='all'?'':project; }
  const WIB_TIME_ZONE = 'Asia/Jakarta';
  function calendarPartsInZone(date, timeZone) {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
    const get = type => Number(parts.find(part => part.type === type).value);
    return { year: get('year'), month: get('month'), day: get('day') };
  }
  function isValidCalendarDate(year, month, day) {
    if (!Number.isInteger(year) || !Number.isInteger(month) || !Number.isInteger(day)) return false;
    if (year < 1 || year > 9999 || month < 1 || month > 12 || day < 1) return false;
    const leap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    const daysInMonth = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
    return day <= daysInMonth;
  }
  function isValidDocumentDate(value) {
    const text = String(value || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return false;
    return isValidCalendarDate(+text.slice(0, 4), +text.slice(5, 7), +text.slice(8, 10));
  }
  function today() { const p = calendarPartsInZone(new Date(), WIB_TIME_ZONE); return [String(p.year).padStart(4, '0'), String(p.month).padStart(2, '0'), String(p.day).padStart(2, '0')].join('-'); }
  function dateText(value) { return value ? new Date(value).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short', timeZone: WIB_TIME_ZONE }) : '—'; }
  function badge(text, kind) { return '<span class="utp-badge ' + esc(kind || '') + '">' + esc(text) + '</span>'; }
  function button(label, action, attrs, kind, disabled) {
    return '<button type="button" class="utp-button ' + esc(kind || '') + '" data-action="' + esc(action) + '" ' + (attrs || '') + (disabled ? ' disabled aria-disabled="true" title="' + esc(contractNotice) + '"' : '') + '>' + esc(label) + '</button>';
  }
  function input(name, label, value, type, attrs) {
    return '<label class="utp-field">' + esc(label) + '<input name="' + esc(name) + '" type="' + (type || 'text') + '" value="' + esc(value) + '" ' + (attrs || '') + '></label>';
  }
  function select(name, label, value, options, attrs) {
    return '<label class="utp-field">' + esc(label) + '<select name="' + esc(name) + '" ' + (attrs || '') + '>' + Object.keys(options).map(key => '<option value="' + esc(key) + '"' + (String(value) === key ? ' selected' : '') + '>' + esc(options[key]) + '</option>').join('') + '</select></label>';
  }
  function materialFilterMarkup(filters, scope) {
    const attr = key => 'data-' + scope + '-filter="' + key + '"';
    return select('brandClass', 'Jenis merek', filters.brandClass || 'ALL', { ALL: 'Semua jenis merek', BRANDED: 'Bermerek', GENERIC: 'Generik terkonfirmasi', UNKNOWN: 'Merek belum diketahui' }, attr('brandClass')) +
      input('brand', 'Merek tersimpan / merek persis', filters.brand, 'text', attr('brand') + ' list="utpBrands-' + scope + '" placeholder="Pilih atau ketik merek" autocomplete="off"') + '<datalist id="utpBrands-' + scope + '">' + knownBrands().map(brand => '<option value="' + esc(brand) + '"></option>').join('') + '</datalist>' +
      input('typeQuery', 'Tipe / spesifikasi mengandung kata', filters.typeQuery, 'search', attr('typeQuery')) +
      input('group', 'Kelompok persis', filters.group, 'text', attr('group')) +
      check('approvedOnly', 'Sesuai approval aktif', filters.approvedOnly, attr('approvedOnly'));
  }
  function textArea(name, label, value, attrs) { return '<label class="utp-field">' + esc(label) + '<textarea name="' + esc(name) + '" ' + (attrs || '') + '>' + esc(value) + '</textarea></label>'; }
  function check(name, label, checked, attrs) { return '<label class="utp-field utp-check"><span><input type="checkbox" name="' + esc(name) + '"' + (checked ? ' checked' : '') + ' ' + (attrs || '') + '> ' + esc(label) + '</span></label>'; }
  function knownBrands() {
    return Array.from(new Set([...(state.catalog.brands || []), ...((state.data && state.data.catalog) || []).map(item => item.brand), ...((state.data && state.data.approvals) || []).flatMap(item => String(item.brand || '').split(/[,;\n]/))].map(value => String(value || '').trim()).filter(Boolean))).sort((a,b) => a.localeCompare(b,'id'));
  }
  function refreshBrandOptions() {
    ['catalog','lookup'].forEach(scope => { const list=el('utpBrands-'+scope); if(list)list.innerHTML=knownBrands().map(brand=>'<option value="'+esc(brand)+'"></option>').join(''); });
  }
  function catalogSortButton(key,label) {
    const active=state.catalog.sortBy===key;
    return button(label+' '+(active?(state.catalog.sortDirection==='asc'?'↑':'↓'):'↕'),'catalog-sort','data-sort="'+key+'" title="Urutkan seluruh hasil berdasarkan '+esc(label)+'" aria-pressed="'+active+'"','utp-sort');
  }
  function compareCatalogItems(a,b,filters) {
    if(!filters.sortBy)return Number(b.approved)-Number(a.approved)||Number(b.favorite)-Number(a.favorite)||a.name.localeCompare(b.name,'id')||a.code.localeCompare(b.code);
    const key=filters.sortBy,direction=filters.sortDirection==='desc'?-1:1;
    const difference=key==='approved'?Number(!!a.approved)-Number(!!b.approved):String(a[key]||'').localeCompare(String(b[key]||''),'id',{numeric:true,sensitivity:'base'});
    return difference*direction||String(a.code).localeCompare(String(b.code),'id',{numeric:true});
  }
  function empty(title, text) { return '<div class="utp-empty"><strong>' + esc(title) + '</strong><p>' + esc(text || '') + '</p></div>'; }
  function errorBox(message, action) { return '<div class="utp-error" role="alert"><p>' + esc(message) + '</p>' + (action ? button('Coba lagi', action) : '') + '</div>'; }
  function header(title, description, action) { return '<header class="utp-page-head"><div><h2>' + esc(title) + '</h2><p class="utp-muted">' + esc(description) + '</p></div><div class="utp-actions">' + (action || '') + '</div></header>'; }
  function toast(message, bad) {
    const box = el('utpToast'); if (!box) return;
    clearTimeout(toastTimer); box.textContent = message; box.classList.toggle('bad', !!bad); box.hidden = false;
    toastTimer = setTimeout(() => { box.hidden = true; }, 6000);
  }
  function liveDrafts() { return !preview && !!(state.data && state.data.capabilities && state.data.capabilities.materialDrafts === true); }
  function liveWorkflow() { return !preview && !!(state.data && state.data.capabilities && state.data.capabilities.materialWorkflow); }
  function editableDraft(record) { return liveDrafts() && record && record.itemContractVersion === 1 && !record.arrived && (liveWorkflow() || record.status === 'DRAFT' && !record.initialSnapshot); }
  function saved(message) { toast(message + ' · Simulasi tersimpan di memori sesi ini saja.'); }
  function banner() {
    const box = el('utpBanner'); if (!box) return;
    box.hidden = false; box.textContent = preview ? 'PRATINJAU LOKAL · DATA ILUSTRASI. Simpan hanya di memori sesi; hilang saat halaman dimuat ulang atau keluar. Pemilihan file mencatat nama dan cakupan saja, tanpa unggah.' : liveWorkflow() ? 'Data Material disimpan ke server. Review dicatat admin sesuai instruksi PM/MK/HO; bukan persetujuan otomatis.' : liveDrafts() ? 'Penyimpanan draf Material menggunakan server.' : contractNotice;
  }
  async function read(action, payload) {
    if (!['bootstrap', 'searchItems', 'list', 'detail'].includes(action)) throw new Error('Tindakan tulis langsung belum tersedia.');
    if (typeof window.utpRpc !== 'function') throw new Error('Koneksi pembacaan UTP belum tersedia. Isian tetap dipertahankan.');
    const result = await window.utpRpc(action, payload || {});
    if (!result || typeof result !== 'object') throw new Error('Respons server tidak dapat dibaca.');
    return result;
  }
  function seed() {
    const catalog = [
      ['001', 'Pipa air PVC', 'RUCIKA', 'AW 1 inch', 'batang', 'Plumbing'], ['02', 'Semen Portland', 'TIGA RODA', 'PCC 40 kg', 'sak', 'Sipil'],
      ['K1', 'Kabel NYM', 'SUPREME', '3 × 2.5 mm²', 'meter', 'Elektrikal'], ['004', 'Pasir pasang', '', '', 'm³', 'Sipil'],
      ['005', 'Baut hexagonal', '', 'M10', 'buah', 'Mekanikal'], ['006', 'Lampu panel LED', 'PHILIPS', '36 W', 'buah', 'Elektrikal'],
      ['007', 'Keramik lantai', 'ROMAN', '60 × 60 cm', 'dus', 'Arsitektur'], ['008', 'Pompa transfer', 'GRUNDFOS', 'CM 3', 'unit', 'Mekanikal'],
      ['009', 'Cat dinding', 'DULUX', 'Interior', 'pail', 'Arsitektur'], ['010', 'Sealant sambungan', '', '', 'tube', 'Arsitektur']
    ].map((row, i) => ({ code: row[0], name: row[1], brand: row[2], model: row[3], unit: row[4], group: row[5], family: row[5], favorite: [0, 2, 4].includes(i), brandStatus: row[2] ? 'CONFIRMED' : 'UNKNOWN' }));
    catalog[3].classification = 'GENERIC'; // Explicit demo confirmation, independent of item code.
    const approvals = [
      { id: 'app-pipe', material: 'Pipa air PVC', brand: 'RUCIKA', types: ['AW 1 inch'], itemCodes: ['001'], generic: false, authority: 'MK', status: 'APPROVED', version: 1, note: 'Ilustrasi approval sesuai merek dan tipe.' },
      { id: 'app-sand', material: 'Pasir pasang', brand: '', types: [], itemCodes: ['004'], generic: true, authority: 'PM', status: 'APPROVED', version: 1, note: 'Ilustrasi persetujuan generik terkonfirmasi.' },
      { id: 'app-cable', material: 'Kabel NYM', brand: 'SUPREME', types: ['3 × 2.5 mm²'], itemCodes: ['K1'], generic: false, authority: 'HO', status: 'COMPARE', version: 1, note: 'Compare belum membuktikan persetujuan.' }
    ];
    const pipe = newItem(catalog[0]), sand = newItem(catalog[3]), cable = newItem(catalog[2]);
    pipe.requiredAuthority = 'MK'; sand.classification = 'GENERIC'; sand.requiredAuthority = 'PM';
    cable.requiredAuthority = 'HO'; cable.exceptionReason = 'Contoh pengajuan di luar approval aktif; menunggu instruksi HO.';
    const req = { id: 'request-demo', version: 1, title: 'Material pekerjaan lantai dasar — ilustrasi', number: '', date: today(), status: 'REVIEW', revision: 1, items: [pipe, sand, cable], files: [], revisions: [], history: [], note: '', arrived: false };
    req.initialSnapshot = snapshot(req); req.initialSnapshot.submittedAt = now();
    pipe.decisions.PM = { status: 'APPROVED', at: now(), reason: 'Sesuai kebutuhan lapangan (ilustrasi).' };
    pipe.decisions.MK = { status: 'APPROVED', at: now(), reason: 'Merek dan tipe sesuai (ilustrasi).' };
    sand.decisions.PM = { status: 'APPROVED', at: now(), reason: 'Generik disetujui (ilustrasi).' };
    return { project: { name: 'Terrasentra Bandung', pm: 'Juhana', code: 'TRSM-51D26-D-M' }, catalog, approvals, requests: [req], documents: [], masterCount: catalog.length };
  }
  function newItem(source) {
    const s = source || {}, brand = String(s.brand == null ? '' : s.brand).trim();
    return { id: uid(), code: String(s.code || ''), name: s.name || '', brand, model: s.model || '', unit: s.unit || '', quantity: 1,
      group: s.group || '', family: s.family || '', classification: itemClassification(Object.assign({}, s, { brand })), isTemporary: !s.code,
      requiredAuthority: 'PM', decisions: { PM: { status: 'PENDING' }, MK: { status: 'PENDING' }, HO: { status: 'PENDING' } }, exceptionReason: '', note: '', finalFileId: '', supplyConfirmed: false };
  }
  function snapshot(record) {
    return clone({ title: record.title, number: record.number || '', date: record.date, revision: record.revision, items: record.items || [], files: record.files || [], note: record.note || '' });
  }
  function freeze(value) { if (value && typeof value === 'object') { Object.freeze(value); Object.keys(value).forEach(key => freeze(value[key])); } return value; }
  function owner(item) { return ['OWNER', 'OTHER'].includes(item.classification); }
  function itemClassification(item) {
    if (item.status === 'OWNER') return 'OWNER';
    const explicit = String(item.classification || '').trim().toUpperCase();
    if (explicit) return Object.prototype.hasOwnProperty.call(classes, explicit) ? explicit : 'UNKNOWN';
    const brandStatus = String(item.brandStatus || '').trim().toUpperCase();
    if (brandStatus === 'GENERIC' || brandStatus === 'UNKNOWN') return brandStatus;
    return norm(item.brand) ? 'BRANDED' : 'UNKNOWN';
  }
  function matches(item, approval) {
    if (owner(item) || !approval || approval.archived || approval.status !== 'APPROVED') return false;
    const classification = itemClassification(item);
    if (!['BRANDED', 'GENERIC'].includes(classification)) return false;
    if (classification === 'GENERIC' ? !approval.generic || !!norm(item.brand) : approval.generic || !norm(item.brand)) return false;
    const codes = approval.itemCodes || [];
    if (codes.length ? !codes.includes(String(item.code || '')) : !norm(approval.material).split(' ').filter(Boolean).every(word => norm([item.name, item.group, item.family].join(' ')).includes(word))) return false;
    if (classification === 'GENERIC' ? !approval.generic : approval.generic || !String(approval.brand || '').split(/[,;\n]/).some(brand => norm(brand) === norm(item.brand))) return false;
    return !(approval.types || []).length || approval.types.some(type => norm(type) === norm(item.model));
  }
  function approvalFor(item) { return (state.data.approvals || []).find(approval => matches(item, approval)); }
  function ready(item, request) {
    if (!request.initialSnapshot) return { ok: false, text: 'Draf — belum diajukan' };
    if (!item.classification || !item.decisions) return { ok: false, text: 'Kontrak per item belum tersedia pada data ini' };
    if (owner(item)) return item.supplyConfirmed ? { ok: true, text: 'Penyediaan dikonfirmasi · menunggu barang' } : { ok: false, text: 'Menunggu konfirmasi penyediaan ' + classes[item.classification] };
    if (!parties.includes(item.requiredAuthority)) return { ok: false, text: 'Tentukan persetujuan diperlukan' };
    for (const party of parties.slice(0, parties.indexOf(item.requiredAuthority) + 1)) {
      const status = (item.decisions[party] || {}).status || 'PENDING';
      if (status !== 'APPROVED') return { ok: false, text: status === 'PENDING' ? 'Menunggu hasil review ' + party : decisions[status] + ' oleh ' + party };
    }
    if (!approvalFor(item) && !String(item.exceptionReason || '').trim()) return { ok: false, text: item.classification === 'UNKNOWN' ? 'Merek belum diketahui; konfirmasi klasifikasi atau catat pengecualian' : 'Belum sesuai approval aktif; perlu approval atau alasan pengecualian' };
    if (item.requiredAuthority === 'HO' && !(request.files || []).some(file => file.id === item.finalFileId && (file.coveredItemIds || []).includes(item.id))) return { ok: false, text: 'Pilih bukti final HO yang mencakup item ini' };
    return { ok: true, text: item.exceptionReason ? 'Dapat dilanjutkan dengan risiko pengecualian' : 'Dapat masuk daftar final' };
  }
  async function bootstrap() {
    if (state.loading) return;
    const generation = epoch; state.loading = true; state.error = ''; render();
    try { const data = preview ? seed() : await read('bootstrap'); if (generation !== epoch) return; state.data = data; }
    catch (error) { if (generation !== epoch) return; state.error = error.message || String(error); }
    finally { if (generation === epoch) { state.loading = false; render(); if (state.data && state.page === 'CATALOG') searchCatalog(); if(pendingDashboardRecord&&state.data){const id=pendingDashboardRecord;pendingDashboardRecord='';if(state.page==='REQUESTS')openRequest(id);} } }
  }
  function render() {
    const app = el('utpApp'), content = el('utpContent'); if (!app || !content) return;
    banner();
    if (!state.data) { content.innerHTML = header(pages[state.page], 'Administrasi material proyek aktif') + (state.loading ? '<div class="utp-empty" role="status">Memuat data…</div>' : errorBox(state.error || 'Data belum dimuat.', 'retry-bootstrap')); return; }
    if (state.page === 'CATALOG') renderCatalog();
    else if (state.page === 'APPROVALS') renderApprovals();
    else if (state.page === 'ARRIVAL') renderArrival();
    else if (state.editor) renderEditor();
    else renderRequests();
  }
  function renderCatalog() {
    const c = state.catalog;
    el('utpContent').innerHTML = header(pages.CATALOG, 'Identitas dan spesifikasi resmi · bukan saldo stok proyek', button('Muat ulang hasil', 'search-catalog') + (!preview && liveWorkflow() ? button('Impor master CSV','import-master') : '')) +
      '<div class="utp-toolbar" id="utpCatalogFilters">' + input('query', 'Cari kode, nama, merek, tipe, satuan, atau keterangan', c.query, 'search', 'data-catalog="query" placeholder="Kode pendek juga dapat dicari" autocomplete="off"') +
      materialFilterMarkup(c, 'catalog') + check('favoriteOnly', 'Favorit saja', c.favoriteOnly, 'data-catalog-filter="favoriteOnly"') + '</div><div id="utpCatalogResults" aria-live="polite"></div>';
    renderCatalogResults();
  }
  function renderCatalogResults() {
    const box = el('utpCatalogResults'); if (!box) return;
    const c = state.catalog;
    if (c.loading) { box.innerHTML = '<div class="utp-empty" role="status">Mencari material…</div>'; return; }
    if (c.error) { box.innerHTML = errorBox(c.error + ' Kata pencarian dipertahankan.', 'search-catalog'); return; }
    const range = c.total ? (c.offset + 1) + '–' + (c.offset + c.items.length) : '0';
    if (!c.items.length) { box.innerHTML = (state.data.masterCount === 0 && !preview ? empty('Master material belum tersedia', 'Impor master resmi melalui tombol Impor master CSV. Data contoh tidak digunakan pada katalog server.') : empty('Material tidak ditemukan', 'Coba kode singkat, ubah kata pencarian, atau longgarkan filter.')) + '<p class="utp-muted">' + range + ' dari ' + c.total + ' hasil · 50 per halaman.</p>'; return; }
    const sortLabels={code:'kode',name:'nama material',brand:'merek',model:'tipe',group:'kelompok',unit:'satuan',approved:'approval'};
    const order=c.sortBy?sortLabels[c.sortBy]+' '+(c.sortDirection==='asc'?'menaik':'menurun'):'approval aktif, favorit, nama';
    box.innerHTML = '<p class="utp-muted">' + range + ' dari ' + esc(c.total) + ' hasil · 50 per halaman. Urutan seluruh hasil: '+esc(order)+'. Klik judul kolom untuk mengurutkan.</p><div class="utp-tablewrap"><table><thead><tr><th><div class="utp-sort-group">'+catalogSortButton('code','Kode')+catalogSortButton('name','Material')+'</div></th><th><div class="utp-sort-group">'+catalogSortButton('brand','Merek')+catalogSortButton('model','Tipe')+'</div></th><th><div class="utp-sort-group">'+catalogSortButton('group','Kelompok')+catalogSortButton('unit','Satuan')+'</div></th><th>'+catalogSortButton('approved','Approval')+'</th><th>Tindakan</th></tr></thead><tbody>' + c.items.map(item => '<tr><td><strong>' + esc(item.code) + '</strong><br>' + esc(item.name) + '</td><td>' + esc(item.brand || (itemClassification(item) === 'GENERIC' ? 'Generik terkonfirmasi' : 'Merek belum diketahui')) + '<br><span class="utp-muted">' + esc(item.model || '—') + '</span></td><td>' + esc(item.group || '—') + '<br>' + esc(item.unit || '—') + '</td><td>' + badge(item.approved ? 'Cocok approval ' + (item.approvalAuthority || '') : 'Belum sesuai approval', item.approved ? 'success' : '') + '</td><td><div class="utp-actions">' + button(item.favorite ? '★ Favorit' : '☆ Favorit', 'favorite', 'data-code="' + esc(item.code) + '" aria-pressed="' + !!item.favorite + '"', '', !preview && !liveWorkflow()) + button('Detail', 'catalog-detail', 'data-code="' + esc(item.code) + '"') + button('Pakai di draf', 'use-item', 'data-code="' + esc(item.code) + '"', '', !preview && !liveDrafts()) + '</div></td></tr>').join('') + '</tbody></table></div>';
    box.insertAdjacentHTML('beforeend', pageControls(c.offset, c.total, 'catalog-page'));
  }
  function pageControls(offset, total, actionName) {
    const last = Math.max(0, Math.floor((total - 1) / 50) * 50);
    const nav = (label, value, disabled) => '<button type="button" class="utp-button" data-action="' + actionName + '" data-offset="' + value + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button>';
    return '<nav class="list-pagination" aria-label="Halaman hasil material">' + nav('Pertama',0,offset===0) + nav('Sebelumnya',Math.max(0,offset-50),offset===0) + '<span>Halaman ' + (Math.floor(offset/50)+1) + ' dari ' + Math.max(1,Math.ceil(total/50)) + '</span>' + nav('Berikutnya',offset+50,offset>=last) + nav('Terakhir',last,offset>=last) + '</nav>';
  }
  function scheduleCatalogSearch(key, value) {
    const catalog = state.catalog;
    catalog[key] = value; catalog.offset = 0; catalog.requestId = ++sequence;
    clearTimeout(timer); timer = setTimeout(searchCatalog, 250);
  }
  function scheduleLookupSearch(key, value) {
    if (!modal) return;
    if (key === 'query') modal.query = value;
    else modal.filters[key] = value;
    modal.offset = 0; modal.searchId += 1;
    clearTimeout(timer);
    const query = key === 'query' ? value : modal.query || '';
    timer = setTimeout(() => lookup(query), 250);
  }
  function previewSearch(filters) {
    const terms = norm(filters.query).split(' ').filter(Boolean);
    const typeQuery = norm(filters.typeQuery);
    const items = state.data.catalog.filter(item => {
      const classification = itemClassification(item);
      return (!filters.favoriteOnly || item.favorite) &&
        (!filters.brandClass || filters.brandClass === 'ALL' || classification === filters.brandClass) &&
        (!filters.brand || norm(item.brand) === norm(filters.brand)) &&
        (!typeQuery || norm(item.model).includes(typeQuery)) &&
        (!filters.group || norm(item.group) === norm(filters.group)) &&
        terms.every(term => norm([item.code, item.name, item.brand, item.brandCandidate, item.brandStatus, item.model, item.unit, item.group, item.family, item.note].join(' ')).includes(term));
    }).map(item => {

        const previous = clone(e.record); e.record.status = 'FINAL';e.record.finalItemIds=e.record.items.filter(item=>ready(item,e.record).ok).map(item=>item.id);e.record.finalSnapshot=snapshot(e.record);e.record.finalSnapshot.items=e.record.finalSnapshot.items.filter(item=>e.record.finalItemIds.includes(item.id)); e.party = party; e.reason = reason;
        try { if (storeEditor('FINALIZE', true)) closeDialog(); else e.record = previous; } catch (error) { e.record = previous; throw error; }
      }, preview?'Tetapkan simulasi':'Tetapkan final');
    }
    if (name === 'publish-revision') return publishRevision();
    if (name === 'confirm-arrival') return confirmArrival(id);
    if (name === 'simulate-failure') { state.editor.failNext = true; return toast('Simpan berikutnya akan gagal sebagai simulasi. Isian akan dipertahankan.'); }
    if (name === 'simulate-conflict') {
      const e = state.editor, server = state.data.requests.find(row => row.id === e.record.id); if (!server) return editorError('Simpan draf sekali sebelum menyimulasikan versi sesi lain.');
      server.title += ' (sesi lain)'; if (server.items[0]) server.items[0].quantity = Number(server.items[0].quantity) + 1; server.version += 1;
      return toast('Versi simulasi sesi lain berubah pada judul dan jumlah item pertama. Tekan Simpan untuk membandingkan.');
    }
  }
  function bind() {
    const app = el('utpApp'), d = el('utpDialog'); if (!app || !d) return;
    function click(event) {
      const target = event.target.closest('[data-action]'); if (!target || target.disabled) return;
      event.preventDefault(); Promise.resolve(action(target.dataset.action, target)).catch(error => { if (d.open) dialogError(error.message || String(error)); else if (state.editor && state.page === 'REQUESTS') editorError(error.message || String(error)); else toast(error.message || String(error), true); });
    }
    let dragged=null;
    app.addEventListener('dragstart',event=>{
      const card=event.target.closest('[data-board-id]');if(!card)return;
      const record=state.data&&state.data.requests.find(r=>r.id===card.dataset.boardId);
      if(!record||!boardWritable(record)||event.target.closest('button,a,input')){event.preventDefault();return;}
      dragged={id:record.id,version:record.version};event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',record.id);card.classList.add('is-dragging');
    });
    app.addEventListener('dragover',event=>{
      const column=event.target.closest('[data-board-stage]');if(!column||!dragged)return;
      const record=state.data.requests.find(r=>r.id===dragged.id),next=record&&boardNext(record);if(next&&next[0]===column.dataset.boardStage){event.preventDefault();event.dataTransfer.dropEffect='move';column.classList.add('is-drop-target');}
    });
    app.addEventListener('dragleave',event=>{const col=event.target.closest('[data-board-stage]');if(col&&!col.contains(event.relatedTarget))col.classList.remove('is-drop-target');});
    app.addEventListener('dragend',()=>{dragged=null;app.querySelectorAll('.is-dragging,.is-drop-target').forEach(n=>n.classList.remove('is-dragging','is-drop-target'));});
    app.addEventListener('drop',event=>{
      const column=event.target.closest('[data-board-stage]'),drag=dragged;if(!column||!drag)return;event.preventDefault();dragged=null;
      app.querySelectorAll('.is-dragging,.is-drop-target').forEach(n=>n.classList.remove('is-dragging','is-drop-target'));
      const record=state.data.requests.find(r=>r.id===drag.id);if(!record||record.version!==drag.version)return toast('Data kartu berubah. Periksa ulang sebelum melanjutkan.',true);
      Promise.resolve(moveBoard(drag.id,column.dataset.boardStage)).catch(error=>{if(d.open)dialogError(error.message);else toast(error.message,true);});
    });
    app.addEventListener('click', click); d.addEventListener('click', click);
    el('utpCloseDialog').addEventListener('click', closeDialog); d.addEventListener('close', () => { if (!d.open) modal = null; });
    d.addEventListener('submit', event => {
      event.preventDefault(); if (!modal || !modal.onSubmit) return;
      const form = event.target, currentModal=modal; if (currentModal.busy || !form.reportValidity()) return;
      currentModal.busy=true;const submit=form.querySelector('[type="submit"]');if(submit)submit.disabled=true;
      Promise.resolve().then(() => currentModal.onSubmit(form)).catch(error => dialogError(error.message || String(error))).finally(()=>{currentModal.busy=false;if(submit)submit.disabled=false;});
    });
    app.addEventListener('submit', event => event.preventDefault());
    app.addEventListener('input', event => {
      const target = event.target;
      if (target.dataset.catalog && target.type !== 'checkbox') {
        scheduleCatalogSearch(target.dataset.catalog, target.value);
      }
      if (target.dataset.catalogFilter && target.type !== 'checkbox') {
        scheduleCatalogSearch(target.dataset.catalogFilter, target.value);
      }
      if (target.dataset.requestField && state.editor && !state.editor.busy) { state.editor.record[target.dataset.requestField] = target.value; state.editor.dirty = true; }
      if (target.dataset.reviewMeta && state.editor) state.editor[target.dataset.reviewMeta] = target.value;
      if (target.id === 'utpApprovalSearch') { state.approvalQuery = target.value; filterCards('APPROVALS', target.id); }
      if (target.id === 'utpRequestSearch') { state.requestQuery = target.value; state.boardPages={}; filterCards('REQUESTS', target.id); }
    });
    app.addEventListener('change', event => {
      const target = event.target;
      if (target.dataset.catalog && target.type === 'checkbox') scheduleCatalogSearch(target.dataset.catalog, target.checked);
      if (target.dataset.catalogFilter && target.type === 'checkbox') scheduleCatalogSearch(target.dataset.catalogFilter, target.checked);
      if (target.dataset.reviewMeta && state.editor) state.editor[target.dataset.reviewMeta] = target.value;
    });
    d.addEventListener('input', event => {
      if (event.target.id === 'utpLookupQuery') scheduleLookupSearch('query', event.target.value);
      if (event.target.dataset.lookupFilter && event.target.type !== 'checkbox') scheduleLookupSearch(event.target.dataset.lookupFilter, event.target.value);
    });
    d.addEventListener('change', event => {
      if (event.target.dataset.lookupFilter && event.target.type === 'checkbox') scheduleLookupSearch(event.target.dataset.lookupFilter, event.target.checked);
      if (['utpItemClassification', 'utpItemAuthority'].includes(event.target.id)) toggleItemFields();
      if (event.target.id === 'utpItemParty' && modal && modal.item) { const status = (modal.item.decisions[event.target.value] || {}).status || 'PENDING'; el('utpItemDecision').value = status; }
    });
  }
  function filterCards(page, focusId) {
    const field = el(focusId), pos = field.selectionStart;
    if (page === 'APPROVALS') renderApprovals(); else renderRequests();
    const replacement = el(focusId); replacement.focus(); if (pos != null) replacement.setSelectionRange(pos, pos);
  }
  function open(page) {
    if(page!=='REQUESTS')pendingDashboardRecord='';
    state.page = Object.prototype.hasOwnProperty.call(pages, page) ? page : 'CATALOG';
    closeDialog();
    if (el('utpApp')) el('utpApp').hidden = false;
    if (!state.data) return bootstrap();
    render(); if (state.page === 'CATALOG') searchCatalog();
  }
  async function createBlank(page) {
    if(!['REQUESTS','APPROVALS'].includes(page))return false;
    if(state.loading||state.boardBusy||state.editor&&state.editor.busy||modal&&modal.busy){toast('Tunggu proses material selesai sebelum membuka form kosong.',true);return false;}
    if(state.editor&&state.editor.dirty&&!confirm('Tutup isian permintaan yang belum disimpan dan buat form kosong?'))return false;
    if(modal&&modal.onSubmit&&!confirm('Tutup isian dialog yang belum disimpan dan buat form kosong?'))return false;
    try {
      newProjectId();
      if(!state.data)await bootstrap();
      if(!state.data)return false;
      if(!preview&&(page==='REQUESTS'?!liveDrafts():!liveWorkflow())){toast(contractNotice,true);return false;}
      closeDialog();
      if(page==='REQUESTS'){createEditor();state.page=page;if(typeof switchMainPage==='function')switchMainPage(page);else renderEditor();}
      else{state.page=page;if(typeof switchMainPage==='function')switchMainPage(page);else renderApprovals();editApproval();}
      return true;
    } catch(error){toast(error.message||String(error),true);return false;}
  }
  function resetSession() {
    epoch += 1; sequence += 1; pendingDashboardRecord='';clearTimeout(timer); clearTimeout(toastTimer); closeDialog(); state = freshState();
    if (el('utpApp')) el('utpApp').hidden = true; if (el('utpContent')) el('utpContent').textContent = ''; if (el('utpToast')) el('utpToast').hidden = true;
  }
  window.UTPFrontend = { open, createBlank, openRecord: id=>{pendingDashboardRecord=String(id);if(state.data){pendingDashboardRecord='';return openRequest(String(id));}if(!state.loading)return bootstrap();}, resetSession, getState: () => clone({ preview, page: state.page, data: state.data, editor: state.editor, catalog: state.catalog, error: state.error }) };
  window.UTPFrontend.setLocalMode = value => { resetSession(); preview = !!value; };
  document.addEventListener('utp-project-change',()=>{
    state.boardPages={};
    if(!state.data)return;
    if(state.editor&&(state.editor.busy||state.editor.dirty)||modal&&modal.onSubmit){toast('Isian material tetap terkait proyek asalnya. Simpan atau tutup isian sebelum membuat dokumen untuk proyek lain.');return;}
    if(state.editor&&!projectMatches(state.editor.record))state.editor=null;
    if(el('utpApp')&&!el('utpApp').hidden){render();if(state.page==='CATALOG')searchCatalog();}
  });
  if (preview) window.UTP_TEST__ = { today, dateText, isValidDocumentDate, isValidCalendarDate, calendarPartsInZone, validateRequest, now };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind, { once: true }); else bind();
})();
</script>
