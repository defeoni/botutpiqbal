<style>
.lpd-page{display:block;text-align:left;color:#1f3042;font-size:14px;line-height:1.55}
.lpd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:0 0 18px}
.lpd-head h2{margin:0 0 5px;font-size:24px;letter-spacing:-.5px;color:#173f3b}
.lpd-head p{margin:0;color:#61758a;font-size:13px;max-width:760px}
.lpd-kicker{margin:0 0 5px!important;color:#0f766e!important;font-size:11px!important;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.lpd-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lpd-actions .btn{margin:0}
.lpd-filter-grid{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(140px,.8fr) minmax(130px,.7fr) minmax(150px,.8fr) auto;gap:12px;align-items:end;padding:16px;background:#fff;border:1px solid #dfe7e9;border-radius:12px;margin:0 0 14px}
.lpd-filter-grid .field{margin:0}
.lpd-filter-actions{display:flex;gap:8px;align-items:center;padding-bottom:1px}
.lpd-filter-actions .btn{margin:0}
.lpd-summary{padding:11px 14px;border:1px solid #dfe7e9;border-left:3px solid #0f766e;border-radius:8px;background:#f7fbfa;color:#3f5a57;font-size:13px;margin:0 0 10px}
.lpd-message{min-height:20px;margin:0 0 14px;font-size:13px;color:#526777}
.lpd-message.ok{color:#166534}
.lpd-message.error{color:#b42318}
.lpd-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(340px,.8fr);gap:18px;align-items:start}
.lpd-column{display:grid;gap:16px;min-width:0}
.lpd-card{padding:18px;background:#fff;border:1px solid #dfe7e9;border-radius:12px;min-width:0}
.lpd-card h3{margin:0 0 4px;font-size:16px;color:#1d3b38}
.lpd-card h4{margin:18px 0 7px;font-size:14px;color:#2d4a47}
.lpd-help{margin:0 0 10px;color:#6a7c8c;font-size:12.5px}
.lpd-muted{color:#71838f;font-size:12px;margin:6px 0}
.lpd-block{display:block;color:#8a9aa6;font-size:11px;margin-top:2px}
.lpd-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0}
.lpd-field{min-width:0}
.lpd-field label{display:block;margin:0 0 5px;font-size:13px;font-weight:600;color:#3d5654}
.lpd-field input,.lpd-field select,.lpd-field textarea{width:100%;min-height:38px;padding:9px 10px;border:1px solid #cfdbde;border-radius:7px;background:#fff;font:inherit;font-size:14px;color:#22343f}
.lpd-field textarea{min-height:72px;resize:vertical}
.lpd-span-2{grid-column:span 2}
.lpd-note-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.lpd-note-head h3{margin:0}
.lpd-tag{display:inline-flex;align-items:center;padding:4px 8px;border:1px solid #dbe6e4;border-radius:6px;background:#f5fbf9;color:#3f6f68;font-size:11px;white-space:nowrap}
.lpd-table{width:100%;min-width:660px;border-collapse:collapse}
.lpd-table th,.lpd-table td{padding:9px 8px;border-bottom:1px solid #e8eef0;text-align:left;vertical-align:top;font-size:13px}
.lpd-table th{background:#f5f9f8;color:#5b716e;font-size:11px;letter-spacing:.02em;font-weight:700}
.lpd-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lpd-total-row td{font-weight:700;color:#24423e;background:#f8fbfa;border-top:1px solid #cfdbde}
.lpd-link{border:0;background:transparent;padding:0;color:#0f766e;font:inherit;font-weight:700;cursor:pointer;text-align:left}
.lpd-link:hover{text-decoration:underline}
.lpd-status{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid #d9e2e5;background:#f1f5f6;color:#52646f;white-space:nowrap}
.lpd-status.draft{background:#f1f5f6;border-color:#d9e2e5;color:#4b5c66}
.lpd-status.sent{background:#fff5e6;border-color:#f3d29b;color:#9a5b00}
.lpd-status.complete{background:#eaf7ef;border-color:#b9e2c8;color:#166534}
.lpd-late{color:#b42318;font-weight:700;white-space:nowrap}
.lpd-open-money{color:#a15c00;font-weight:700}
.lpd-empty{padding:18px 10px;text-align:center;border:1px dashed #d7e2e6;border-radius:8px;color:#84949e;font-size:13px;margin:8px 0}
.lpd-nota{border:1px solid #e0e9eb;border-radius:10px;padding:14px;margin:0 0 12px;background:#fcfdfd}
.lpd-nota-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lpd-nota-head h5{margin:0;font-size:14px;color:#24443f}
.lpd-nota-amount{margin-left:auto;color:#61757c;font-size:12px;font-variant-numeric:tabular-nums}
.lpd-small{padding:6px 9px!important;font-size:11px!important;margin:0!important}
.lpd-subitems{margin:12px 0;border:1px solid #e4ebed;border-radius:8px;overflow:hidden}
.lpd-subitem-head,.lpd-subitem-row{display:grid;grid-template-columns:minmax(150px,1fr) 96px 140px 70px;gap:8px;align-items:center;padding:7px 9px}
.lpd-subitem-head{background:#f2f7f6;color:#647a77;font-size:11px;font-weight:700}
.lpd-subitem-row{border-top:1px solid #edf2f3}
.lpd-subitem-row input{min-height:34px;font-size:13px}
.lpd-subitems>.btn{margin:8px 9px!important}
.lpd-attach-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 7px;font-size:13px;color:#3d5654}
.lpd-upload{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid #cfdbde;border-radius:6px;background:#fff;color:#526a67;font-size:11px;font-weight:600;cursor:pointer;margin:0}
.lpd-upload input{width:130px;min-height:0;padding:0;border:0;font-size:10px}
.lpd-attachments{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.lpd-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 7px;border:1px solid #dbe6e4;border-radius:6px;background:#f4faf8;font-size:11px}
.lpd-chip a{color:#0f766e;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.lpd-chip a:hover{text-decoration:underline}
.lpd-chip button{border:0;background:transparent;color:#7a8c94;font-size:14px;line-height:1;cursor:pointer;padding:0 2px}
.lpd-settle{display:grid;gap:0;margin:8px 0 4px;border:1px solid #e3eaec;border-radius:8px;overflow:hidden}
.lpd-settle-row{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-bottom:1px solid #edf2f3;font-size:13px}
.lpd-settle-row:last-child{border-bottom:0}
.lpd-settle-row span{color:#5b707a}
.lpd-settle-row strong{font-variant-numeric:tabular-nums;color:#243b47;white-space:nowrap}
.lpd-settle-row.warn strong{color:#a15c00}
.lpd-settle-row.ok strong{color:#166534}
.lpd-settle-status{margin:10px 0 4px;padding:9px 10px;border-radius:7px;font-size:12.5px;font-weight:600}
.lpd-settle-status.ok{background:#eaf7ef;color:#166534}
.lpd-settle-status.warn{background:#fff5e6;color:#9a5b00}
.lpd-settle-status.danger{background:#fdecea;color:#b42318}
.lpd-reimb{margin:10px 0 0;padding:9px 10px;border:1px solid #f0dfc2;border-radius:7px;background:#fffbf3;font-size:12px;color:#7a5a20}
.lpd-reimb strong{display:block;margin-bottom:4px}
.lpd-audit{display:grid;gap:0;border:1px solid #e6edef;border-radius:8px;overflow:hidden;max-height:280px;overflow-y:auto}
.lpd-audit-row{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:8px;padding:7px 9px;border-bottom:1px solid #eef3f4;font-size:11px;color:#6b7d88}
.lpd-audit-row:last-child{border-bottom:0}
.lpd-audit-row strong{font-weight:600;color:#3d5654;overflow-wrap:anywhere}
.lpd-audit-row span:last-child{text-align:right;overflow-wrap:anywhere}
.lpd-row-actions{display:flex;flex-wrap:wrap;gap:5px;min-width:150px}
.lpd-row-actions .btn{margin:0!important}
.lpd-row-warn td{background:#fffbf3}
.lpd-page .tablewrap{border:1px solid #e6edef;border-radius:8px}
@media(max-width:1240px){.lpd-layout{grid-template-columns:minmax(0,1fr)}.lpd-filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.lpd-filter-actions{grid-column:1/-1}}
@media(max-width:820px){.lpd-head{display:block}.lpd-head .lpd-actions{margin-top:12px}.lpd-filter-grid{grid-template-columns:1fr 1fr}.lpd-grid-3{grid-template-columns:1fr 1fr}.lpd-span-2{grid-column:1/-1}.lpd-subitem-head,.lpd-subitem-row{grid-template-columns:minmax(120px,1fr) 80px 110px 60px}}
@media(max-width:560px){.lpd-filter-grid,.lpd-grid-3{grid-template-columns:1fr}.lpd-audit-row{grid-template-columns:1fr}}
/* Match the compact desktop workspace without changing finance behavior. */
.lpd-head{margin-bottom:10px}
.lpd-head h2{font-size:22px}
.lpd-filter-grid{gap:8px;padding:10px;border-radius:8px}
.lpd-layout{gap:12px}
.lpd-grid-3{gap:8px;margin:8px 0}
.lpd-field input,.lpd-field select,.lpd-field textarea{min-height:34px;padding:7px 9px}
.lpd-message:empty{display:none}
.lpd-card{padding:12px}
.lpd-nota{padding:10px;margin-bottom:8px}
.lpd-small{font-size:12px!important}
</style>
