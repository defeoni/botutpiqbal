<script>
(function () {
  let generation = 0, loading = false, dashboard = null;
  const get = id => document.getElementById(id);
  const put = (id, value) => { if (get(id)) get(id).textContent = value; };
  const rpc = (name, args) => new Promise((resolve, reject) => invokeServer(name, args, resolve, reject));
  const colors=['#0f766e','#2563eb','#d97706','#7c3aed','#64748b'];
  function chart(id,values,type){
    const root=get(id);if(!root)return;root.replaceChildren();
    if(!values){root.textContent='Data grafik belum tersedia.';return;}
    const entries=Object.entries(values).map(([label,value])=>[label,Number(value)||0]),total=entries.reduce((sum,r)=>sum+r[1],0);
    if(!total){root.textContent='Belum ada dokumen untuk ditampilkan.';return;}
    if(type==='donut'){
      const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 160 160');svg.setAttribute('role','img');svg.setAttribute('aria-label',entries.map(r=>r[0]+': '+r[1]).join(', '));
      let start=0;entries.forEach(([label,value],i)=>{if(!value)return;const circle=document.createElementNS(ns,'circle');const arc=value/total*100;Object.entries({cx:80,cy:80,r:58,fill:'none',stroke:colors[i%colors.length],'stroke-width':21,pathLength:100,'stroke-dasharray':arc+' '+(100-arc),'stroke-dashoffset':-start,transform:'rotate(-90 80 80)'}).forEach(([k,v])=>circle.setAttribute(k,v));svg.appendChild(circle);start+=arc;});
      const text=document.createElementNS(ns,'text');text.setAttribute('x',80);text.setAttribute('y',87);text.setAttribute('text-anchor','middle');text.setAttribute('class','chart-total');text.textContent=total;svg.appendChild(text);root.appendChild(svg);
    }
    const legend=document.createElement('div');legend.className=type==='bars'?'chart-bars':'chart-legend';
    const max=Math.max(...entries.map(r=>r[1]),1);
    entries.forEach(([label,value],i)=>{const row=document.createElement('div');row.className='chart-row';const dot=document.createElement('span');dot.className='chart-dot';dot.style.background=colors[i%colors.length];const caption=document.createElement('span');caption.textContent=label;const number=document.createElement('strong');number.textContent=value;row.append(dot,caption,number);if(type==='bars'){const track=document.createElement('div');track.className='chart-track';const fill=document.createElement('span');fill.style.width=(value/max*100)+'%';fill.style.background=colors[i%colors.length];track.appendChild(fill);row.appendChild(track);}legend.appendChild(row);});root.appendChild(legend);
  }
  window.workspaceRpc = (action, payload) => {
    if (!accessToken) return Promise.reject(new Error('Masuk dahulu untuk mengakses data proyek.'));
    return rpc('apiWorkspace', [action, payload || {}, accessToken]);
  };
  function render() {
    const d = dashboard;
    put('hoMemoCount', d && d.memo ? d.memo.count : '—');
    put('hoRpbCount', d && d.rpb ? d.rpb.count : '—');
    put('hoMemoSummary', d && d.memo ? 'Memo tersimpan. Riwayat lengkap di bawah.' : 'Data memo belum tersedia.');
    put('hoRpbSummary', d && d.rpb ? d.rpb.pending+' RPB masih dalam proses.' : 'Data RPB belum tersedia.');
    const rawCounts = d && d.workspace && d.workspace.counts || {};
    const counts = Object.fromEntries(Object.entries({Tugas:'tasks','Nota/Keuangan':'finance','Arsip Proyek':'archives',SDM:'people',Absensi:'attendance',RPD:'rpd'}).map(([name,key])=>[name,rawCounts[key]]));
    put('hoRpdCount', counts.RPD == null ? '—' : counts.RPD);
    chart('hoDocumentChart',d&&d.memo&&d.rpb&&counts.RPD!=null?{Memo:d.memo.count,RPB:d.rpb.count,RPD:counts.RPD}:null,'bars');
    put('hoRecent', d && d.activities.length ? d.activities.map(r => {const date=new Date(r.date);return (Number.isNaN(date.getTime())?r.date:date.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short'}))+' · '+r.text;}).join('\n') : 'Belum ada aktivitas yang dimuat.');
    const state = window.UTPFrontend && window.UTPFrontend.getState();
    const simulation = state && state.preview && state.data;
    const rows = simulation ? state.data.requests : d && d.material ? d.material.recent : [];
    const material = simulation ? {
      review: rows.filter(r => r.initialSnapshot && !['FINAL','ARRIVED','CANCELLED'].includes(r.status)).length,
      waiting: rows.filter(r => r.status === 'FINAL' && !r.arrived).length,
      arrived: rows.filter(r => r.arrived || r.status === 'ARRIVED').length
    } : d && d.material;
    let distribution=material&&material.distribution;
    if(simulation){distribution={Draf:0,Review:0,'Menunggu barang':0,Datang:0,Dibatalkan:0};rows.forEach(r=>distribution[r.arrived||r.status==='ARRIVED'?'Datang':r.status==='DRAFT'?'Draf':r.status==='FINAL'?'Menunggu barang':r.status==='CANCELLED'?'Dibatalkan':'Review']++);}
    chart('projectStatusChart',distribution,'donut');
    put('projectSource', simulation ? 'Simulasi memori terpisah dari server' : d ? 'Data server · '+new Date(d.loadedAt).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}) : 'Data belum dimuat.');
    put('projectReviewCount', material ? material.review : '—');
    put('projectFinalCount', material ? material.waiting : '—');
    put('projectArrivalCount', material ? material.arrived : '—');
    get('projectRecentRows').replaceChildren();
    (rows || []).slice(0,5).forEach(r => {
      const tr = document.createElement('tr');
      [r.number || 'Draf',r.title,r.status,r.arrived ? 'Dikonfirmasi' : 'Belum dikonfirmasi'].forEach(value => { const td=document.createElement('td');td.textContent=value||'—';tr.appendChild(td); });
      get('projectRecentRows').appendChild(tr);
    });
    put('projectEmpty', rows && rows.length ? '' : 'Belum ada permintaan yang dimuat.');
    put('projectTaskSummary', counts.Tugas == null ? 'Data tugas belum tersedia.' : counts.Tugas+' tugas tersimpan.');
    put('projectLocalSummary', ['Nota/Keuangan','Arsip Proyek','SDM','Absensi'].map(name => name+': '+(counts[name] == null ? '—' : counts[name])).join(' · '));
    put('dashboardStatus', d && d.warnings.length ? 'Sebagian data gagal dimuat: '+d.warnings.join(' | ') : d ? 'Ringkasan server berhasil dimuat.' : '');
  }
  window.loadWorkspaceDashboard = async function () {
    if (!accessToken || loading) { render(); return; }
    const token=accessToken, epoch=generation; loading=true;
    put('dashboardStatus','Memuat ringkasan server…');
    try { const data=await rpc('apiDashboard',[token]);if(epoch===generation && token===accessToken){dashboard=data;render();} }
    catch(error){if(epoch===generation)put('dashboardStatus','Gagal memuat ringkasan: '+error.message+' · tekan Muat ulang ringkasan.');}
    finally {if(epoch===generation)loading=false;}
  };
  window.refreshHoSummary = render;
  window.refreshProjectSummary = render;
  window.resetWorkspaceSession = () => {generation++;loading=false;dashboard=null;render();if(window.WorkspaceTools)window.WorkspaceTools.reset();if(window.RpdWorkspace&&window.RpdWorkspace.reset)window.RpdWorkspace.reset();};
  document.addEventListener('click', async event => {
    const b=event.target.closest('button');if(!b)return;
    if(b.dataset.projectTool){if(window.WorkspaceTools&&window.WorkspaceTools.isBusy())return;switchMainPage('TOOLS');window.openProjectTool(b.dataset.projectTool);}
    if(b.id==='dashboardReload')window.loadWorkspaceDashboard();
    if(b.id==='materialLocalMode' || b.id==='materialServerMode'){
      if(!confirm('Tutup isian material saat ini dan pindah sumber data? Isian belum disimpan akan hilang.'))return;
      window.UTPFrontend.setLocalMode(b.id==='materialLocalMode');switchMainPage('REQUESTS');
    }
    if(b.id==='resetProjectLocal'){
      if(!confirm('Hapus draf perangkat Proyek? Data server dan HO tetap disimpan.'))return;
      try{Object.keys(localStorage).filter(k=>k.startsWith('utp.fe.project.')||k==='utp.fe.material').forEach(k=>localStorage.removeItem(k));put('projectResetStatus','Draf perangkat Proyek dihapus.');}
      catch(error){put('projectResetStatus','Gagal: '+error.message);}
    }
    if(b.id==='resetProjectServer'){
      if(get('projectResetConfirmation').value!=='RESET PROYEK'){put('projectResetStatus','Ketik RESET PROYEK lebih dahulu.');return;}
      const ticket=generation, token=accessToken;
      const pin=await askDeletePin_('reset data proyek');if(!pin)return;
      if(ticket!==generation || token!==accessToken)return;
      b.disabled=true;
      try{const r=await rpc('apiResetProject',[{pin,confirmation:get('projectResetConfirmation').value},token]);if(ticket!==generation || token!==accessToken)return;put('projectResetStatus',r.message+(r.warnings.length?' | '+r.warnings.join(' | '):''));window.UTPFrontend.resetSession();if(window.WorkspaceTools)window.WorkspaceTools.reset();get('projectResetConfirmation').value='';window.loadWorkspaceDashboard();}
      catch(error){if(ticket===generation && token===accessToken)put('projectResetStatus','Reset gagal: '+error.message);}
      finally{b.disabled=false;}
    }
  });
})();
</script>
