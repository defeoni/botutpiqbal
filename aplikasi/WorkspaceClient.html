<script>
(function () {
  let generation = 0, loading = false, dashboard = null;
  const get = id => document.getElementById(id);
  const put = (id, value) => { if (get(id)) get(id).textContent = value; };
  const rpc = (name, args) => new Promise((resolve, reject) => invokeServer(name, args, resolve, reject));
  const colors=['#2563eb','#0d9488','#e7a138','#8b5cf6','#94a3b8'];
  const iconPaths={home:'M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',building:'M4 21V3h12v18M16 9h4v12M8 7h4M8 11h4M8 15h4M9 21v-3h2v3',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',layers:'m12 3 10 5-10 5L2 8zM2 12l10 5 10-5M2 16l10 5 10-5',board:'M3 4h18v16H3zM9 4v16M15 4v16M5 8h2M11 8h2M17 8h2M5 12h2M11 12h2',box:'m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10M7 4l10 5',check:'M9 11l2 2 4-4M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z',truck:'M1 5h13v12H1zM14 9h5l4 4v4h-9M6 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4M18 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4',task:'M9 3h6v4H9zM9 5H5v16h14V5h-4M8 12l2 2 5-5M8 18h8',wallet:'M3 5h16v4M3 5l13-3v3M3 5v16h18V9H3M16 13h5v4h-5z',folder:'M3 7V4h6l3 3h9v14H3z',calendar:'M3 5h18v16H3zM7 2v6M17 2v6M3 11h18M7 15h2M13 15h2',file:'M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h6',chart:'M4 3v18h17M8 16v-4M13 16V7M18 16v-6',users:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 3a4 4 0 0 1 0 8M22 21v-3a4 4 0 0 0-3-4',settings:'m9 3-1 3-3 1-2 4 2 2v3l3 3 3-1 3 1 3-3v-3l2-2-2-4-3-1-1-3zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M12 7v5l3 2'};
  function decorate(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{if(el.querySelector('svg'))return;const svg='<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(iconPaths[el.dataset.icon]||iconPaths.file)+'"/></svg>';if(el.matches('button')){const label=el.textContent;el.innerHTML=svg;const span=document.createElement('span');span.textContent=label;el.appendChild(span);}else el.innerHTML=svg;});}
  window.setWorkspaceScope=function(scope){document.querySelectorAll('[data-workspace-scope]').forEach(el=>el.hidden=el.dataset.workspaceScope!=='shared'&&el.dataset.workspaceScope!==scope);document.querySelectorAll('[data-workspace]').forEach(el=>{el.classList.toggle('active',el.dataset.workspace===scope);el.setAttribute('aria-pressed',String(el.dataset.workspace===scope));});put('workspaceLabel',scope==='ho'?'Head Office':'Administrasi Proyek');get('navSearch').value='';filterNavigation();};
  function filterNavigation(){const query=get('navSearch').value.toLocaleLowerCase('id');let found=0;document.querySelectorAll('[data-workspace-scope]:not([hidden]) .tab').forEach(button=>{button.hidden=!button.textContent.toLocaleLowerCase('id').includes(query);if(!button.hidden)found++;});document.querySelectorAll('.nav-folder').forEach(folder=>{folder.hidden=!!query&&!Array.from(folder.querySelectorAll('.tab')).some(b=>!b.hidden);if(query&&!folder.hidden)folder.open=true;});get('navEmpty').hidden=found>0;}
  get('navSearch').addEventListener('input',filterNavigation);
  const boardPages={};
  function homeBoard(id,columns,rows){
    const root=get(id);if(!root)return;root.replaceChildren();
    const unavailable=!rows;rows=rows||[];
    columns.forEach(([stage,label,color])=>{const entries=rows.filter(r=>r.stage===stage),key=id+stage;let page=Math.min(boardPages[key]||0,Math.max(0,Math.ceil(entries.length/6)-1));
      const column=document.createElement('section');column.className='overview-column';const heading=document.createElement('h3'),dot=document.createElement('i'),count=document.createElement('span');dot.style.background=color;count.textContent=unavailable?'—':entries.length;heading.append(dot,document.createTextNode(label),count);column.appendChild(heading);
      const list=document.createElement('div');list.className='overview-cards';column.appendChild(list);
      function renderCards(){boardPages[key]=page;list.replaceChildren();entries.slice(page*6,page*6+6).forEach(r=>{const card=document.createElement('article');card.className='overview-card';const tag=document.createElement('span');tag.className='subtle-tag';tag.textContent=r.module||'Material';const title=document.createElement('h4');title.textContent=r.title||'Tanpa judul';const detail=document.createElement('p');detail.textContent=r.subtitle||r.number||'Nomor belum ditetapkan';const status=document.createElement('small');status.className='overview-status';status.textContent=({DRAFT:'Draf',SUBMITTED:'Diajukan',REVIEW:'Dalam review',FINAL:'Daftar final',ARRIVED:'Diterima',CANCELLED:'Dibatalkan'})[r.status]||r.status||'';const button=document.createElement('button');button.type='button';button.className='overview-open';button.textContent=r.module?'Buka '+r.module+' ↗':'Buka detail ↗';if(r.module){button.dataset.main=r.module;if(r.module==='RPB')button.dataset.homeRpb=r.id;button.classList.add('main-nav-button');}else button.dataset.homeRequest=r.id;card.append(tag,title,detail,status,button);list.appendChild(card);});if(!entries.length){const empty=document.createElement('p');empty.className='overview-empty';empty.textContent=unavailable?'Data belum dimuat':'Belum ada dokumen';list.appendChild(empty);}if(entries.length>6){const nav=document.createElement('div');nav.className='overview-page';const prev=document.createElement('button'),next=document.createElement('button'),label=document.createElement('span');prev.type=next.type='button';prev.textContent='←';next.textContent='→';prev.setAttribute('aria-label','Halaman sebelumnya '+stage);next.setAttribute('aria-label','Halaman berikutnya '+stage);prev.disabled=page===0;next.disabled=(page+1)*6>=entries.length;label.textContent=(page+1)+' / '+Math.ceil(entries.length/6);prev.onclick=()=>{page--;renderCards();};next.onclick=()=>{page++;renderCards();};nav.append(prev,label,next);list.appendChild(nav);}}
      renderCards();root.appendChild(column);
    });
  }
  function chart(id,values,type){
    const root=get(id);if(!root)return;root.replaceChildren();
    if(!values){root.textContent='Data grafik belum tersedia.';return;}
    const entries=Object.entries(values).map(([label,value])=>[label,Number(value)||0]),total=entries.reduce((sum,r)=>sum+r[1],0);
    if(!total){root.textContent='Belum ada dokumen untuk ditampilkan.';return;}
    if(type==='donut'){
      const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 160 160');svg.setAttribute('role','img');svg.setAttribute('aria-label',entries.map(r=>r[0]+': '+r[1]).join(', '));
      let start=0;entries.forEach(([label,value],i)=>{if(!value)return;const circle=document.createElementNS(ns,'circle');const arc=value/total*100;Object.entries({cx:80,cy:80,r:58,fill:'none',stroke:colors[i%colors.length],'stroke-width':21,pathLength:100,'stroke-dasharray':arc+' '+(100-arc),'stroke-dashoffset':-start,transform:'rotate(-90 80 80)'}).forEach(([k,v])=>circle.setAttribute(k,v));svg.appendChild(circle);start+=arc;});
      const text=document.createElementNS(ns,'text');text.setAttribute('x',80);text.setAttribute('y',87);text.setAttribute('text-anchor','middle');text.setAttribute('class','chart-total');text.textContent=total;svg.appendChild(text);root.appendChild(svg);
    }
    const legend=document.createElement('div');legend.className=type==='bars'?'chart-bars':'chart-legend';
    const max=Math.max(...entries.map(r=>r[1]),1);
    entries.forEach(([label,value],i)=>{const row=document.createElement('div');row.className='chart-row';const dot=document.createElement('span');dot.className='chart-dot';dot.style.background=colors[i%colors.length];const caption=document.createElement('span');caption.textContent=label;const number=document.createElement('strong');number.textContent=value;row.append(dot,caption,number);if(type==='bars'){const track=document.createElement('div');track.className='chart-track';const fill=document.createElement('span');fill.style.width=(value/max*100)+'%';fill.style.background=colors[i%colors.length];track.appendChild(fill);row.appendChild(track);}legend.appendChild(row);});root.appendChild(legend);
  }
  window.workspaceRpc = (action, payload) => {
    if (!accessToken) return Promise.reject(new Error('Masuk dahulu untuk mengakses data proyek.'));
    const p=Object.assign({},payload),projectId=window.ProjectWorkspace?window.ProjectWorkspace.getActiveId():'all';
    if(action==='list')p.projectId=projectId;
    if(action==='upload'){if(projectId==='all')return Promise.reject(new Error('Pilih satu proyek untuk lampiran.'));p.projectId=projectId;}
    if(action==='save'){if(projectId==='all')return Promise.reject(new Error('Pilih satu proyek sebelum menyimpan catatan.'));p.record=Object.assign({},p.record,{projectId:p.record&&p.record.projectId||projectId});}
    return rpc('apiWorkspace', [action, p, accessToken]);
  };
  function render() {
    const d = dashboard;
    put('hoMemoCount', d && d.memo ? d.memo.count : '—');
    put('hoRpbCount', d && d.rpb ? d.rpb.count : '—');
    put('hoMemoSummary', d && d.memo ? 'Memo tersimpan. Riwayat lengkap di bawah.' : 'Data memo belum tersedia.');
    put('hoRpbSummary', d && d.rpb ? d.rpb.pending+' RPB masih dalam proses.' : 'Data RPB belum tersedia.');
    const rawCounts = d && d.workspace && d.workspace.counts || {};
    const counts = Object.fromEntries(Object.entries({Tugas:'tasks','Nota/Keuangan':'finance','Arsip Proyek':'archives',SDM:'people',Absensi:'attendance',RPD:'rpd'}).map(([name,key])=>[name,rawCounts[key]]));
    put('hoRpdCount', counts.RPD == null ? '—' : counts.RPD);
    chart('hoDocumentChart',d&&d.memo&&d.rpb&&counts.RPD!=null?{Memo:d.memo.count,RPB:d.rpb.count,RPD:counts.RPD}:null,'bars');
    put('hoRecent', d && d.activities.length ? d.activities.map(r => {const date=new Date(r.date);return (Number.isNaN(date.getTime())?r.date:date.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short'}))+' · '+r.text;}).join('\n') : 'Belum ada aktivitas yang dimuat.');
    const state = window.UTPFrontend && window.UTPFrontend.getState();
    const simulation = state && state.preview && state.data;
    const rows = simulation ? state.data.requests : d && d.material ? d.material.recent : [];
    const boardRows=simulation?state.data.requests:d&&d.material?d.material.board:null;
    homeBoard('projectHomeBoard',[['DRAFT','Draf','#94a3b8'],['REVIEW','Dalam review','#e7a138'],['FINAL','Siap dipenuhi','#2563eb'],['WAITING','Menunggu barang','#8b5cf6'],['ARRIVED','Diterima','#0d9488'],['CANCELLED','Dibatalkan','#dc6471']],boardRows?boardRows.map(r=>({...r,status:r.arrived?'Kedatangan dikonfirmasi':r.status,stage:r.arrived||r.status==='ARRIVED'?'ARRIVED':r.status==='CANCELLED'?'CANCELLED':r.status==='DRAFT'?'DRAFT':r.status==='FINAL'?r.fulfillmentConfirmed?'WAITING':'FINAL':'REVIEW',subtitle:(r.itemCount==null?(r.items||[]).length:r.itemCount)+' item · '+(r.date||'Tanggal belum dicatat')})):null);
    const hoRows=d?[...(d.memo&&d.memo.board||[]),...(d.rpb&&d.rpb.board||[]),...(d.rpd&&d.rpd.board||[])].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))):null;
    homeBoard('hoHomeBoard',[['DRAFT','Draf','#94a3b8'],['PROCESS','Dalam proses','#e7a138'],['ARCHIVED','Tercatat / Arsip','#0d9488']],hoRows);
    put('hoManpowerCount',manpowerLoaded?manpowerRecords.filter(r=>r.status==='AKTIF').length:'—');
    put('hoManpowerSummary',manpowerLoaded?manpowerRecords.length+' personel di direktori':'Direktori belum tersedia');
    put('hoPeopleSummary',manpowerLoaded?'Data personel dari direktori HO.':'Direktori belum tersedia. Buka Data Manpower untuk memuat.');
    get('hoPeopleList').replaceChildren();if(manpowerLoaded)manpowerRecords.slice(0,4).forEach(person=>{const row=document.createElement('div');row.className='person-row';const avatar=document.createElement('span');avatar.className='person-avatar';avatar.textContent=String(person.name||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();const text=document.createElement('div'),name=document.createElement('strong'),detail=document.createElement('small');name.textContent=person.name;detail.textContent=[person.skill,person.project].filter(Boolean).join(' · ');text.append(name,detail);const status=document.createElement('span');status.className='subtle-tag';status.textContent=person.status==='AKTIF'?'Aktif':'Nonaktif';row.append(avatar,text,status);get('hoPeopleList').appendChild(row);});
    const material = simulation ? {
      review: rows.filter(r => r.initialSnapshot && !['FINAL','ARRIVED','CANCELLED'].includes(r.status)).length,
      waiting: rows.filter(r => r.status === 'FINAL' && !r.arrived).length,
      arrived: rows.filter(r => r.arrived || r.status === 'ARRIVED').length
    } : d && d.material;
    let distribution=material&&material.distribution;
    if(simulation){distribution={Draf:0,Review:0,'Menunggu barang':0,Datang:0,Dibatalkan:0};rows.forEach(r=>distribution[r.arrived||r.status==='ARRIVED'?'Datang':r.status==='DRAFT'?'Draf':r.status==='FINAL'?'Menunggu barang':r.status==='CANCELLED'?'Dibatalkan':'Review']++);}
    chart('projectStatusChart',distribution,'donut');
    put('projectSource', simulation ? 'Simulasi memori terpisah dari server' : d ? 'Data server · '+new Date(d.loadedAt).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}) : 'Data belum dimuat.');
    put('projectReviewCount', material ? material.review : '—');
    put('projectFinalCount', material ? material.waiting : '—');
    put('projectArrivalCount', material ? material.arrived : '—');
    get('projectRecentRows').replaceChildren();
    (rows || []).slice(0,5).forEach(r => {
      const tr = document.createElement('tr');
      [r.number || 'Draf',r.title,r.status,r.arrived ? 'Dikonfirmasi' : 'Belum dikonfirmasi'].forEach(value => { const td=document.createElement('td');td.textContent=value||'—';tr.appendChild(td); });
      get('projectRecentRows').appendChild(tr);
    });
    put('projectEmpty', rows && rows.length ? '' : 'Belum ada permintaan yang dimuat.');
    put('projectTaskCount',counts.Tugas==null?'—':counts.Tugas);
    put('projectTaskSummary', counts.Tugas == null ? 'Data tugas belum tersedia.' : counts.Tugas+' tugas tersimpan.');
    put('projectLocalSummary', ['Nota/Keuangan','Arsip Proyek','Absensi'].map(name => name+': '+(counts[name] == null ? '—' : counts[name])).join(' · '));
    put('dashboardStatus', d && d.warnings.length ? 'Sebagian data gagal dimuat: '+d.warnings.join(' | ') : d ? 'Ringkasan server berhasil dimuat.' : '');
  }
  window.loadWorkspaceDashboard = async function () {
    if(window.ProjectWorkspace)await window.ProjectWorkspace.ready();
    if (!accessToken || loading) { render(); return; }
    const token=accessToken, epoch=generation; loading=true;
    put('dashboardStatus','Memuat ringkasan server…');
    try { const data=await rpc('apiDashboard',[token,window.ProjectWorkspace?window.ProjectWorkspace.getActiveId():'all']);if(epoch===generation && token===accessToken){dashboard=data;render();} }
    catch(error){if(epoch===generation)put('dashboardStatus','Gagal memuat ringkasan: '+error.message+' · tekan Muat ulang ringkasan.');}
    finally {if(epoch===generation)loading=false;}
  };
  window.refreshHoSummary = render;
  window.decorateWorkspace=decorate;decorate();
  window.refreshProjectSummary = render;
  window.resetWorkspaceSession = () => {generation++;loading=false;dashboard=null;window.UTP_PIN_DEFERRED=false;if(window.PeopleProfiles)window.PeopleProfiles.reset();if(window.ProjectWorkspace)window.ProjectWorkspace.reset();if(window.DocumentCenter)window.DocumentCenter.resetSession();render();if(window.WorkspaceTools)window.WorkspaceTools.reset();if(window.RpdWorkspace&&window.RpdWorkspace.reset)window.RpdWorkspace.reset();if(window.LPDWorkspace&&window.LPDWorkspace.reset)window.LPDWorkspace.reset();};
  document.addEventListener('utp-project-change',()=>{generation++;loading=false;dashboard=null;render();window.loadWorkspaceDashboard();if(window.DocumentCenter)window.DocumentCenter.reload();});
  document.addEventListener('click', async event => {
    const b=event.target.closest('button');if(!b)return;
    if(b.dataset.workspace){switchMainPage(b.dataset.workspace==='ho'?'HO':'HOME');}
    if(b.dataset.homeRequest){switchMainPage('REQUESTS');window.UTPFrontend.openRecord(b.dataset.homeRequest);}
    if(b.dataset.projectTool){
      const title=b.dataset.projectTool;
      if(!accessToken){window.pendingProjectTool=title;showLoginPanel_('Masuk data server untuk membuka '+title+'.');return;}
      if(window.WorkspaceTools&&window.WorkspaceTools.isBusy())return;
      if(window.openProjectTool(title)===false)return;
      switchMainPage('TOOLS');document.querySelector('.app-main>.header h1').textContent=title;document.title=title+' · UTP Workspace';put('pageCrumb',title);document.querySelectorAll('.sidebar-nav [data-project-tool]').forEach(el=>el.classList.toggle('active',el.dataset.projectTool===title));
    }
    if(b.id==='dashboardReload')window.loadWorkspaceDashboard();
    if(b.id==='materialLocalMode' || b.id==='materialServerMode'){
      if(!confirm('Tutup isian material saat ini dan pindah sumber data? Isian belum disimpan akan hilang.'))return;
      window.UTPFrontend.setLocalMode(b.id==='materialLocalMode');switchMainPage('REQUESTS');
    }
    if(b.id==='resetProjectLocal'){
      if(!confirm('Hapus draf perangkat Proyek? Data server dan HO tetap disimpan.'))return;
      try{Object.keys(localStorage).filter(k=>k.startsWith('utp.fe.project.')||k==='utp.fe.material').forEach(k=>localStorage.removeItem(k));put('projectResetStatus','Draf perangkat Proyek dihapus.');}
      catch(error){put('projectResetStatus','Gagal: '+error.message);}
    }
    if(b.id==='resetProjectServer'){
      if(get('projectResetConfirmation').value!=='RESET PROYEK'){put('projectResetStatus','Ketik RESET PROYEK lebih dahulu.');return;}
      const ticket=generation, token=accessToken;
      const pin=await askDeletePin_('reset data proyek');if(!pin)return;
      if(ticket!==generation || token!==accessToken)return;
      b.disabled=true;
      try{const r=await rpc('apiResetProject',[{pin,confirmation:get('projectResetConfirmation').value},token]);if(ticket!==generation || token!==accessToken)return;put('projectResetStatus',r.message+(r.warnings.length?' | '+r.warnings.join(' | '):''));window.UTPFrontend.resetSession();if(window.WorkspaceTools)window.WorkspaceTools.reset();get('projectResetConfirmation').value='';window.loadWorkspaceDashboard();}
      catch(error){if(ticket===generation && token===accessToken)put('projectResetStatus','Reset gagal: '+error.message);}
      finally{b.disabled=false;}
    }
  });
})();
</script>
