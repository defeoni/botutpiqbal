<dialog id="dcOwnerDialog" class="dc-dialog"><form id="dcOwnerForm"><h2>Template owner proyek</h2><p>Berkas asli disimpan; setiap pemakaian membuat salinan baru. Pengelompokan manual dapat diubah.</p><label>Berkas (dapat beberapa sekaligus, maksimal 5 MB per berkas)<input id="dcOwnerFiles" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></label><label>Nama (kosong: nama berkas)<input id="dcOwnerTitle" maxlength="200"></label><label>Kluster<select id="dcOwnerCluster"><option value="A">Pelaksanaan</option><option value="B">Pemeliharaan</option><option value="C" selected>Administrasi</option></select></label><label>Kelompok<input id="dcOwnerStage" maxlength="100" value="Dokumen Owner"></label><label>Disiplin / sistem<input id="dcOwnerSystem" maxlength="100" value="Administrasi"></label><label>Frekuensi<select id="dcOwnerFrequency"><option>Berdasarkan kejadian</option><option>Harian</option><option>Mingguan</option><option>Bulanan</option></select></label><p id="dcOwnerMessage" role="status"></p><menu><button id="dcOwnerClose" type="button" class="btn">Tutup</button><button id="dcOwnerSave" class="btn primary">Simpan</button></menu></form></dialog>
<script>
(function(){

    ['ref-pn','MEMO-PN','Contoh Memo Penambahan OS','1tBS5IvvfDYiCZP7dr_YQLFofd48fCPZo'],

  [['ref-sewa','SEWA','Perjanjian Sewa Menyewa — template Word','template','DOCX'],['ref-sewa-scan','SEWA-PDF','Contoh Perjanjian Sewa Menyewa — scan terisi','example','PDF'],['ref-data-mess','DATA-MESS','Contoh Data Kontrakan dan Penghuni','example','XLSX']].forEach(([id,code,title,kind,format])=>templates.push({id,code,title,kind,format,origin:'UTP',cluster:'C',stage:'Referensi Administrasi',system:'Administrasi',frequency:'Berdasarkan kejadian',pic:'Admin Proyek'}));
  [['ref-mess','MESS','Pengajuan Kontrakan / Mess','https://drive.google.com/drive/folders/1GvoX3HlkgVtJabe96fC72qUo6aPW2wRR'],['ref-lapangan','LAPANGAN','Form Lapangan','https://drive.google.com/file/d/1U3kzmIuZmaxr8oLE9bNwLaTuAbEVKTU9/view']].forEach(([id,code,title,driveUrl])=>templates.push({id,code,title,driveUrl,origin:'UTP',cluster:'C',stage:'Referensi Administrasi',system:'Administrasi',kind:'reference',format:'Folder / Berkas',pic:'Admin Proyek',frequency:'Berdasarkan kejadian'}));
  const driveSourceId=url=>(String(url||'').match(/\/d\/([a-zA-Z0-9_-]{10,})/)||[])[1]||'';
  templates.forEach(t=>{t.templateSourceId=t.page?'':driveSourceId(t.driveUrl);});
  let docs=[],editing=null,drag='',epoch=0,projectEpoch=0,loadedAt=0,loading=false;
  const state={view:'board',space:'active',origin:'all',query:'',quick:'all',stage:'',page:1,board:'status',uploadBusy:false,filters:{cluster:new Set(),kind:new Set(),system:new Set(),frequency:new Set(),pic:new Set()}};
  const rpc=(name,args)=>new Promise((resolve,reject)=>invokeServer(name,args,resolve,reject));
  const projectId=()=>window.ProjectWorkspace?window.ProjectWorkspace.getActiveId():'all';
  const scopeNow=()=>({projectId:projectId(),epoch:projectEpoch,token:accessToken});

  const pendingKey=project=>'utp.pendingDocument.'+project;

  function rememberPending(id,project){window.UTP_PENDING_DOCUMENT_ID=id;const store=pendingStore();if(store&&project&&project!=='all'){try{store.setItem(pendingKey(project),id);}catch(e){}}}
  function clearPending(project){const target=project||projectId();window.UTP_PENDING_DOCUMENT_ID='';const store=pendingStore();if(store&&target&&target!=='all'){try{store.removeItem(pendingKey(target));}catch(e){}}}
  function restorePending(){const store=pendingStore(),project=projectId();if(!store||!project||project==='all')return;try{window.UTP_PENDING_DOCUMENT_ID=store.getItem(pendingKey(project))||'';}catch(e){}}
  window.UtpPendingDocument={remember:rememberPending,clear:clearPending,restore:restorePending,key:pendingKey};
  restorePending();
  const requestId=()=>{try{return crypto.randomUUID();}catch(e){return 'doc-'+Date.now()+'-'+Math.random().toString(36).slice(2);}};
  const showStatus=message=>{get('dcStatus').textContent=message||'';};
  const templateOf=doc=>Object.assign({},templates.find(t=>t.id===doc.templateId)||{code:doc.source||'DOC',cluster:'C',stage:'Arsip proyek',system:'Administrasi',pic:'Admin Proyek'},doc,{origin:doc.origin||'UTP'});

  const kinds={template:'▤ Template UTP',form:'✎ Form aplikasi',example:'▧ Contoh terisi',reference:'▣ Referensi'};
  function urgency(due){if(!due)return 'NONE';const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value])),iso=parts.year+'-'+parts.month+'-'+parts.day,days=Math.round((Date.parse(due.slice(0,10)+'T00:00:00Z')-Date.parse(iso+'T00:00:00Z'))/86400000);return days<0?'OVERDUE':days===0?'TODAY':days<=3?'H'+days:'NONE';}
  function match(t){const hay=[t.code,t.title,t.stage,t.system,t.pic].join(' ').toLocaleLowerCase('id');return state.query.split(/\s+/).filter(Boolean).every(w=>hay.includes(w))&&(!state.stage||t.stage===state.stage)&&Object.entries(state.filters).every(([k,set])=>!set.size||set.has(t[k]))&&(state.quick!=='material'||t.system==='Material')&&(state.quick!=='maintenance'||t.cluster==='B')&&(state.quick!=='routine'||t.frequency!=='Berdasarkan kejadian');}
  const visibleTemplates=()=>templates.filter(t=>(t.origin!=='OWNER'||t.projectId===projectId())&&(state.origin==='all'||t.origin===state.origin)&&match(t));
  const visibleDocs=()=>docs.filter(d=>(projectId()==='all'||(d.projectId||'legacy')===projectId())&&(state.origin==='all'||(d.origin||'UTP')===state.origin)&&(state.space==='archive'?d.status==='SELESAI':d.status!=='SELESAI')&&match(templateOf(d))&&(state.quick!=='attention'||(urgency(d.due)!=='NONE'||!!d.followUpDate)));
  function button(label,handler,cls){const b=node('button',label,'btn '+(cls||''));b.type='button';b.onclick=handler;return b;}
  function openLink(url){if(/^https?:\/\//i.test(url||''))window.open(url,'_blank','noopener');}
  function route(t,doc,blank,scope){
    const active=scope||scopeNow();
    if(!scopeAlive(active))return false;
    if(doc&&(doc.projectId||'legacy')!==active.projectId)return false;
    if(doc&&doc.fileUrl){openLink(doc.fileUrl);return true;}
    if(doc&&doc.url){openLink(doc.url);return true;}
    if(t.tool){const b=document.querySelector('[data-project-tool="'+t.tool+'"]');if(b)b.click();return true;}
    if(t.page){
      if(doc&&doc.source==='document'&&(doc.projectId||'legacy')===active.projectId)rememberPending(doc.id,active.projectId);
      if(blank&&t.page==='RPD'&&window.RpdWorkspace&&!window.RpdWorkspace.createBlank())return false;
      if(blank&&window.UTPFrontend&&['REQUESTS','APPROVALS'].includes(t.page)){window.UTPFrontend.createBlank(t.page);return true;}
      switchMainPage(t.page);
      if(blank){if(t.page==='RPB'&&window.createBlankRpb_)window.createBlankRpb_();else if(t.page==='MEMO'&&window.createBlankMemo_)window.createBlankMemo_(t.memoType||'PN');}else if(t.memoType)switchType(t.memoType);
      if(t.page==='RPB'&&window.ProjectWorkspace){const p=window.ProjectWorkspace.getActive();get('rpbFormError').textContent=p?'Form RPB baru · '+p.name:'Pilih satu proyek terlebih dahulu.';}
      return true;
    }
    if(t.driveUrl)openLink(t.driveUrl);
    return true;
  }
  function openTemplate(t){get('dcTemplateTitle').textContent=t.code+' · '+t.title;get('dcTemplateMeta').textContent=[kinds[t.kind],clusters[t.cluster],t.stage,t.format].join(' · ');get('dcTemplateAvailability').textContent=t.page?'Form aplikasi tersedia melalui Tambah dokumen → pilih form.':t.driveUrl?'Buka sumber template / contoh di Drive.':'File unggahan belum ditautkan ke Drive.';const link=get('dcTemplateLink');link.hidden=!t.driveUrl;if(t.driveUrl)link.href=t.driveUrl;else link.removeAttribute('href');get('dcTemplateDialog').showModal();}
  function filters(){const groups={cluster:Object.keys(clusters),kind:Object.keys(kinds),system:[...new Set(templates.map(t=>t.system))],frequency:[...new Set(templates.map(t=>t.frequency))],pic:[...new Set(templates.map(t=>t.pic))]},titles={cluster:'▣ Kluster',kind:'▤ Jenis berkas',system:'⚒ Sistem / barang',frequency:'◷ Rutinitas',pic:'♙ Penanggung jawab'},box=get('dcFilterPanel');box.replaceChildren();box.appendChild(button('↺ Bersihkan filter',()=>{state.query='';state.stage='';state.quick='all';Object.values(state.filters).forEach(s=>s.clear());get('dcSearch').value='';state.page=1;render();}));Object.entries(groups).forEach(([key,values])=>{const section=node('details',null,'dc-filter-group');section.open=true;section.appendChild(node('summary',titles[key]));values.filter(Boolean).forEach(value=>{const label=node('label'),input=node('input'),caption=node('span',clusters[value]||kinds[value]||value),count=node('small',templates.filter(t=>t[key]===value).length);input.type='checkbox';input.checked=state.filters[key].has(value);input.onchange=()=>{input.checked?state.filters[key].add(value):state.filters[key].delete(value);state.page=1;render();};label.append(input,caption,count);section.appendChild(label);});box.appendChild(section);});get('dcFilterTotal').textContent=Object.values(state.filters).reduce((n,s)=>n+s.size,0);}
  function list(){
    const box=get('dcList'),items=visibleTemplates(),pages=Math.max(1,Math.ceil(items.length/18));state.page=Math.min(state.page,pages);box.replaceChildren();
    items.slice((state.page-1)*18,state.page*18).forEach(t=>{
      const card=node('article',null,'dc-form-card');card.tabIndex=0;card.setAttribute('role','button');card.onclick=()=>openTemplate(t);card.onkeydown=e=>{if(e.key==='Enter'&&e.target===card)openTemplate(t);};
      card.append(node('small',(t.origin==='OWNER'?'Template owner':kinds[t.kind])+' · '+t.code),node('h3','('+(t.origin==='OWNER'?'OWNER':'UTP')+') '+t.title),node('p',[t.stage,t.system,t.frequency].join(' · ')));
      const actions=node('div',null,'dc-card-actions');actions.append(button('ⓘ Detail',e=>{e.stopPropagation();openTemplate(t);}));
      if(t.driveUrl)actions.append(button('↗ Buka berkas',e=>{e.stopPropagation();openLink(t.driveUrl);}));
      if(t.page||t.templateSourceId)actions.append(button(t.page?'＋ Form kosong':'Gunakan template',e=>{e.stopPropagation();newDraft(t.id);}));
      if(t.origin==='OWNER')actions.append(button('Kelompok / frekuensi',e=>{e.stopPropagation();ownerDialog(t);}));
      card.appendChild(actions);box.appendChild(card);
    });
    if(!items.length)box.append(node('p','Tidak ada form yang cocok.'));
    const pager=node('nav',null,'dc-list-pager'),prev=button('← Sebelumnya',()=>{state.page--;list();}),next=button('Berikutnya →',()=>{state.page++;list();});prev.disabled=state.page===1;next.disabled=state.page===pages;pager.append(prev,node('span','Halaman '+state.page+' dari '+pages+' · '+items.length+' form'),next);box.appendChild(pager);
  }
  function graph(){const box=get('dcGraph');box.replaceChildren();Object.entries(clusters).forEach(([key,title])=>{const items=visibleTemplates().filter(t=>t.cluster===key),section=node('section',null,'dc-cluster');section.dataset.cluster=key;section.append(node('h3',title+' · '+items.length));[...new Set(items.map(t=>t.stage))].forEach(stage=>section.appendChild(button(stage+' ('+items.filter(t=>t.stage===stage).length+')',()=>{state.stage=stage;state.view='list';state.page=1;render();get('dcListView').scrollIntoView({block:'start',behavior:'auto'});},'dc-cluster-node')));box.appendChild(section);});}
  function board(){
    const box=get('dcBoard');box.replaceChildren();
    Object.entries(state.board==='status'?statuses:deadlines).forEach(([value,label])=>{
      const section=node('section',null,'dc-board-column'),items=visibleDocs().filter(d=>(state.board==='status'?d.status:urgency(d.due))===value);section.append(node('h3',label+' · '+items.length));
      items.forEach(d=>{
        const card=node('article',null,'dc-board-card');card.draggable=state.space!=='archive';card.tabIndex=0;
        card.append(node('small',projectName(d.projectId)+' · '+(d.origin==='OWNER'?'Owner':'UTP')),node('h4',d.title),node('p',deadlines[urgency(d.due)]+' · '+(d.due||'Belum dijadwalkan')));
        if(d.recipient||d.requiredAction)card.append(node('p',[d.recipient,d.requiredAction].filter(Boolean).join(' · ')));
        if(d.followUpDate)card.append(node('small','Follow-up '+d.followUpDate));
        card.append(button('▣ Arsip / edit / proses',()=>openRecord(d)));card.onclick=e=>{if(!e.target.closest('button'))openRecord(d);};card.onkeydown=e=>{if(e.key==='Enter'&&e.target===card)openRecord(d);};card.ondragstart=()=>drag=d.id;card.ondragend=()=>drag='';section.appendChild(card);

      section.ondragover=e=>e.preventDefault();section.ondrop=e=>{e.preventDefault();const doc=docs.find(d=>d.id===drag);if(!doc||state.space==='archive')return;state.pending={doc,target:value,kind:state.board==='status'?'status':'deadline'};get('dcTransitionTitle').textContent='Konfirmasi perpindahan';get('dcTransitionHelp').textContent=doc.title+' → '+label;get('dcTransitionReason').value='';get('dcTransitionDialog').showModal();};box.appendChild(section);
    });
    const boardEmpty=get('dcBoardEmpty');if(boardEmpty)boardEmpty.hidden=visibleDocs().length>0;

  function render(){
    filters();list();graph();board();root.querySelectorAll('.dc-view').forEach(e=>e.classList.toggle('active',e.id==='dc'+state.view[0].toUpperCase()+state.view.slice(1)+'View'));
    root.querySelectorAll('[data-dc-view]').forEach(b=>b.classList.toggle('active',b.dataset.dcView===state.view));root.querySelectorAll('[data-dc-space]').forEach(b=>b.classList.toggle('primary',b.dataset.dcSpace===state.space));root.querySelectorAll('[data-dc-quick]').forEach(b=>b.classList.toggle('active',b.dataset.dcQuick===state.quick));root.querySelectorAll('[data-dc-board]').forEach(b=>b.classList.toggle('active',b.dataset.dcBoard===state.board));

  async function reload(force=true){
    if(!accessToken){docs=[];render();return;}
    if(loading||(!force&&Date.now()-loadedAt<30000))return;
    const requestProject=projectId(),ticket=++epoch,token=accessToken;
    loading=true;render();
    try{
      await window.ProjectWorkspace.ready();
      const link=window.UTP_TELEGRAM_DOCUMENT;
      if(link&&link.id&&link.project&&link.project!==projectId()){
        if(!window.ProjectWorkspace.getProjects().some(p=>p.id===link.project)&&link.project!=='legacy'){window.UTP_TELEGRAM_DOCUMENT=null;showStatus('Proyek pada tautan Telegram tidak tersedia.');return;}
        loading=false;
        window.ProjectWorkspace.select(link.project);return;
      }
      if(ticket!==epoch||token!==accessToken||requestProject!==projectId())return;
      const result=await rpc('apiProjects',['documents',{projectId:requestProject},token]);
      if(ticket!==epoch||token!==accessToken||requestProject!==projectId())return;
      docs=result.documents||[];for(let i=templates.length-1;i>=0;i--)if(templates[i].origin==='OWNER')templates.splice(i,1);templates.push(...(result.ownerTemplates||[]));loadedAt=Date.now();showStatus((result.warnings||[]).join(' · '));
      if(link&&link.id){const doc=docs.find(d=>d.id===link.id||d.workspaceDocumentId===link.id);if(doc){window.UTP_TELEGRAM_DOCUMENT=null;openRecord(doc);}else showStatus('Dokumen dari Telegram tidak tersedia pada proyek ini.');}
    }catch(e){
      if(ticket===epoch&&token===accessToken&&requestProject===projectId())showStatus(e.message);
    }finally{if(ticket===epoch){loading=false;render();}}
  }
  function newDraft(id){
    if(!accessToken){showLoginPanel_('Masuk untuk membuat dokumen.');return;}
    const scope=scopeNow();
    const dialog=get('dcNewDraftDialog');
    if(dialog.open&&scopeAlive(state.draftScope)){const title=get('dcNewDraftTitle');if(title&&title.focus)title.focus();return;}
    if(dialog.open)dialog.close();
    const projects=get('dcNewDraftProject');projects.replaceChildren();
    projects.add(new Option('Pilih proyek',''));
    (window.ProjectWorkspace?window.ProjectWorkspace.getProjects():[]).forEach(p=>projects.add(new Option(p.name,p.id)));
    if(scope.projectId==='legacy')projects.add(new Option('Data lama — belum dipetakan','legacy'));
    projects.value=scope.projectId==='all'?'':scope.projectId;
    get('dcNewDraftMessage').textContent='';
    const select=get('dcNewDraftTemplate');select.replaceChildren();
    templates.filter(t=>t.origin!=='OWNER'||t.projectId===scope.projectId).forEach(t=>select.add(new Option((t.page?'✎ ':'▤ ')+t.code+' · '+t.title,t.id)));
    if(id)select.value=id;
    get('dcNewDraftTitle').value='';get('dcNewDraftDue').value='';
    state.draftScope=scope;state.draftRequestId=requestId();
    dialog.showModal();
  }
  get('dcNewDraftProject').onchange=()=>{
    const selected=get('dcNewDraftProject').value;
    if(!selected||!window.ProjectWorkspace)return;
    const template=get('dcNewDraftTemplate').value,title=get('dcNewDraftTitle').value,due=get('dcNewDraftDue').value;
    get('dcNewDraftDialog').close();
    window.ProjectWorkspace.select(selected);
    newDraft(template);
    get('dcNewDraftTitle').value=title;get('dcNewDraftDue').value=due;
  };
  function openRecord(doc){
