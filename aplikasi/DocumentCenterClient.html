  const driveSourceId=url=>(String(url||'').match(/\/d\/([a-zA-Z0-9_-]{10,})/)||[])[1]||'';
  templates.forEach(t=>{t.templateSourceId=t.page?'':driveSourceId(t.driveUrl);});
  let docs=[],editing=null,drag='',epoch=0,projectEpoch=0,loadedAt=0,loading=false;

  function urgency(due){if(!due)return 'NONE';const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value])),iso=parts.year+'-'+parts.month+'-'+parts.day,days=Math.round((Date.parse(due.slice(0,10)+'T00:00:00Z')-Date.parse(iso+'T00:00:00Z'))/86400000);return days<0?'OVERDUE':days===0?'TODAY':days<=3?'H'+days:'NONE';}

  function openTemplate(t){get('dcTemplateTitle').textContent=t.code+' · '+t.title;get('dcTemplateMeta').textContent=[kinds[t.kind],clusters[t.cluster],t.stage,t.format].join(' · ');get('dcTemplateAvailability').textContent=t.page?'Form aplikasi tersedia melalui Tambah dokumen → pilih form.':t.driveUrl?'Buka sumber template / contoh di Drive.':'File unggahan belum ditautkan ke Drive.';const link=get('dcTemplateLink');link.hidden=!t.driveUrl;if(t.driveUrl)link.href=t.driveUrl;else link.removeAttribute('href');get('dcTemplateDialog').showModal();}
  function filters(){const groups={cluster:Object.keys(clusters),kind:Object.keys(kinds),system:[...new Set(templates.map(t=>t.system))],frequency:[...new Set(templates.map(t=>t.frequency))],pic:[...new Set(templates.map(t=>t.pic))]},titles={cluster:'▣ Kluster',kind:'▤ Jenis berkas',system:'⚒ Sistem / barang',frequency:'◷ Rutinitas',pic:'♙ Penanggung jawab'},box=get('dcFilterPanel');box.replaceChildren();box.appendChild(button('↺ Bersihkan filter',()=>{state.query='';state.stage='';state.quick='all';Object.values(state.filters).forEach(s=>s.clear());get('dcSearch').value='';state.page=1;render();}));Object.entries(groups).forEach(([key,values])=>{const section=node('details',null,'dc-filter-group');section.open=true;section.appendChild(node('summary',titles[key]));values.filter(Boolean).forEach(value=>{const label=node('label'),input=node('input'),caption=node('span',clusters[value]||kinds[value]||value),count=node('small',templates.filter(t=>t[key]===value).length);input.type='checkbox';input.checked=state.filters[key].has(value);input.onchange=()=>{input.checked?state.filters[key].add(value):state.filters[key].delete(value);state.page=1;render();};label.append(input,caption,count);section.appendChild(label);});box.appendChild(section);});get('dcFilterTotal').textContent=Object.values(state.filters).reduce((n,s)=>n+s.size,0);}
  function list(){const box=get('dcList'),items=visibleTemplates(),pages=Math.max(1,Math.ceil(items.length/18));state.page=Math.min(state.page,pages);box.replaceChildren();items.slice((state.page-1)*18,state.page*18).forEach(t=>{const card=node('article',null,'dc-form-card');card.tabIndex=0;card.setAttribute('role','button');card.onclick=()=>openTemplate(t);card.onkeydown=e=>{if(e.key==='Enter'&&e.target===card)openTemplate(t);};card.append(node('small',kinds[t.kind]+' · '+t.code),node('h3','(UTP) '+t.title),node('p',[t.stage,t.system,t.frequency].join(' · ')));const actions=node('div',null,'dc-card-actions');actions.append(button('ⓘ Detail',e=>{e.stopPropagation();openTemplate(t);}));if(t.driveUrl)actions.append(button('↗ Buka berkas',e=>{e.stopPropagation();openLink(t.driveUrl);}));if(t.page)actions.append(button('＋ Form kosong',e=>{e.stopPropagation();newDraft(t.id);}));card.appendChild(actions);box.appendChild(card);});if(!items.length)box.append(node('p','Tidak ada form yang cocok.'));const pager=node('nav',null,'dc-list-pager'),prev=button('← Sebelumnya',()=>{state.page--;list();}),next=button('Berikutnya →',()=>{state.page++;list();});prev.disabled=state.page===1;next.disabled=state.page===pages;pager.append(prev,node('span','Halaman '+state.page+' dari '+pages+' · '+items.length+' form'),next);box.appendChild(pager);}
  function graph(){const box=get('dcGraph');box.replaceChildren();Object.entries(clusters).forEach(([key,title])=>{const items=visibleTemplates().filter(t=>t.cluster===key),section=node('section',null,'dc-cluster');section.dataset.cluster=key;section.append(node('h3',title+' · '+items.length));[...new Set(items.map(t=>t.stage))].forEach(stage=>section.appendChild(button(stage+' ('+items.filter(t=>t.stage===stage).length+')',()=>{state.stage=stage;state.view='list';state.page=1;render();get('dcListView').scrollIntoView({block:'start',behavior:'auto'});},'dc-cluster-node')));box.appendChild(section);});}
  function board(){const box=get('dcBoard');box.replaceChildren();Object.entries(state.board==='status'?statuses:deadlines).forEach(([value,label])=>{const section=node('section',null,'dc-board-column'),items=visibleDocs().filter(d=>(state.board==='status'?d.status:urgency(d.due))===value);section.append(node('h3',label+' · '+items.length));items.forEach(d=>{const card=node('article',null,'dc-board-card');card.draggable=true;card.tabIndex=0;card.append(node('small',projectName(d.projectId)),node('h4',d.title),node('p',deadlines[urgency(d.due)]+' · '+(d.due||'Belum dijadwalkan')),button('▣ Arsip / edit / proses',()=>openRecord(d)));card.onclick=e=>{if(!e.target.closest('button'))openRecord(d);};card.onkeydown=e=>{if(e.key==='Enter'&&e.target===card)openRecord(d);};card.ondragstart=()=>drag=d.id;card.ondragend=()=>drag='';section.appendChild(card);});if(!items.length)section.appendChild(node('p','Belum ada dokumen','dc-board-empty'));section.ondragover=e=>e.preventDefault();section.ondrop=e=>{e.preventDefault();const doc=docs.find(d=>d.id===drag);if(!doc)return;if(state.board==='status'){state.pending={doc,target:value,kind:'status'};}else{state.pending={doc,target:value,kind:'deadline'};}get('dcTransitionTitle').textContent='Konfirmasi perpindahan';get('dcTransitionHelp').textContent=doc.title+' → '+label;get('dcTransitionReason').value='';get('dcTransitionDialog').showModal();};box.appendChild(section);});const boardEmpty=get('dcBoardEmpty');if(boardEmpty)boardEmpty.hidden=visibleDocs().length>0;}
  function render(){filters();list();graph();board();root.querySelectorAll('.dc-view').forEach(e=>e.classList.toggle('active',e.id==='dc'+state.view[0].toUpperCase()+state.view.slice(1)+'View'));root.querySelectorAll('[data-dc-view]').forEach(b=>b.classList.toggle('active',b.dataset.dcView===state.view));root.querySelectorAll('[data-dc-quick]').forEach(b=>b.classList.toggle('active',b.dataset.dcQuick===state.quick));root.querySelectorAll('[data-dc-board]').forEach(b=>b.classList.toggle('active',b.dataset.dcBoard===state.board));const chips=get('dcActiveFilters');chips.replaceChildren();if(state.stage)chips.append(button('✕ '+state.stage,()=>{state.stage='';render();}));get('dcSummary').textContent=visibleTemplates().length+' form / referensi · '+visibleDocs().length+' dokumen proyek · '+(loading?'Memuat arsip…':!accessToken?'Masuk data server untuk memuat arsip':'Data server');const reminder=get('dcReminderList');reminder.replaceChildren();visibleDocs().filter(d=>urgency(d.due)!=='NONE'&&d.status!=='SELESAI').sort((a,b)=>String(a.due).localeCompare(String(b.due))).slice(0,5).forEach(d=>reminder.appendChild(button(deadlines[urgency(d.due)]+' · '+d.title,()=>openRecord(d))));}
  async function reload(force=true){
    if(!accessToken){docs=[];render();return;}
    if(loading||(!force&&Date.now()-loadedAt<30000))return;

    if(dialog.open)dialog.close();

    if(scope.projectId==='legacy')projects.add(new Option('Data lama — belum dipetakan','legacy'));

  get('dcNewDraftProject').onchange=()=>{

  function openRecord(doc){
    const scope=scopeNow();
    if(!scopeAlive(scope)||!doc||(doc.projectId||'legacy')!==scope.projectId){showStatus('Dokumen bukan milik proyek aktif.');return;}
    editing=doc;state.recordScope=scope;
    const form=get('dcRecordForm');get('dcRecordHeading').textContent=doc.title;form.elements.title.value=doc.title;form.elements.due.value=doc.due||'';form.elements.note.value=doc.note||'';

    const history=get('dcRecordHistory');history.replaceChildren();(doc.history||[]).forEach(h=>history.append(node('p',h.at+' · '+h.reason)));
    const original=doc.record||{};[['Salinan template',doc.fileUrl],['Google Sheets',original.spreadsheetUrl||original.sheetUrl],['Excel',original.excelUrl],['PDF',original.pdfUrl],['Folder arsip',original.folderUrl]].forEach(([label,url])=>{if(/^https?:\/\//i.test(url||'')){const a=node('a',label,'btn');a.href=url;a.target='_blank';a.rel='noopener';get('dcRecordDetails').appendChild(a);}});
    get('dcRecordMessage').textContent=local?'':'Status ini mencatat tracking administrasi. Keputusan approval dan data sumber diedit melalui Buka formulir / arsip.';
    const dialog=get('dcRecordDialog');if(dialog.open)dialog.close();dialog.showModal();
  }
  async function saveDocument(record,action='save'){
    const scope=scopeNow();
    if(!scope.token)throw new Error('Masuk data server untuk menyimpan dokumen.');
    if(scope.projectId==='all')throw new Error('Pilih satu proyek sebelum menyimpan dokumen.');
    if(record.projectId&&record.projectId!==scope.projectId)throw new Error('Dokumen bukan milik proyek aktif.');
    if(record.source&&record.source!=='document')action=action==='delete'?'hide':'track';
    const result=await rpc('apiProjectDocument',[action,{record},scope.token]);
    if(!scopeAlive(scope))return {stale:true};
    if(result.conflict)throw new Error('Dokumen berubah di sesi lain. Muat ulang; isian dipertahankan.');
    return result;
  }
  get('dcRecordClose').onclick=()=>get('dcRecordDialog').close();
  get('dcRecordOpen').onclick=()=>{
    const d=editing,t=templateOf(d),scope=state.recordScope||scopeNow();
    if(!d||!scopeAlive(scope)||(d.projectId||'legacy')!==scope.projectId){showStatus('Dokumen bukan milik proyek aktif.');get('dcRecordDialog').close();return;}
    get('dcRecordDialog').close();

    else if(d.source==='rpd'){switchMainPage('RPD');window.RpdWorkspace.openRecord(d.sourceId);}
    else if(d.source==='memo')switchMainPage('MEMO');
    else if(d.source==='requests'){switchMainPage('REQUESTS');window.UTPFrontend.openRecord(d.sourceId);}
    else if(d.source==='approvals'){switchMainPage('APPROVALS');}

  };

    finally{b.disabled=false;}
