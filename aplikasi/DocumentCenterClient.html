<dialog id="dcRecordDialog" class="dc-dialog"><form id="dcRecordForm"><h2 id="dcRecordHeading">Arsip dokumen</h2><div id="dcRecordDetails"></div><label>Judul<input name="title" required maxlength="300"></label><label>Deadline<input name="due" type="date"></label><label>Status<select name="status"></select></label><label>Catatan / alasan<textarea name="note" maxlength="2000"></textarea></label><details><summary>Riwayat perubahan</summary><div id="dcRecordHistory"></div></details><p id="dcRecordMessage" role="status"></p><menu><button class="btn" type="button" id="dcRecordOpen">↗ Buka formulir / arsip</button><button class="btn red" type="button" id="dcRecordDelete">Hapus kartu</button><button class="btn" type="button" id="dcRecordClose">Tutup</button><button class="btn primary" id="dcRecordSave">Simpan</button></menu></form></dialog>
<script>
(function(){

  [['ref-mess','MESS','Pengajuan Kontrakan / Mess','https://drive.google.com/drive/folders/1GvoX3HlkgVtJabe96fC72qUo6aPW2wRR'],['ref-lapangan','LAPANGAN','Form Lapangan','https://drive.google.com/file/d/1U3kzmIuZmaxr8oLE9bNwLaTuAbEVKTU9/view']].forEach(([id,code,title,driveUrl])=>templates.push({id,code,title,driveUrl,origin:'UTP',cluster:'C',stage:'Referensi Administrasi',system:'Administrasi',kind:'reference',format:'Folder / Berkas',pic:'Admin Proyek',frequency:'Berdasarkan kejadian'}));

  function urgency(due){if(!due)return 'NONE';const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value])),iso=parts.year+'-'+parts.month+'-'+parts.day,days=Math.round((Date.parse(due.slice(0,10)+'T00:00:00Z')-Date.parse(iso+'T00:00:00Z'))/86400000);return days<0?'OVERDUE':days===0?'TODAY':days<=3?'H'+days:'NONE';}

  function openTemplate(t){get('dcTemplateTitle').textContent=t.code+' · '+t.title;get('dcTemplateMeta').textContent=[kinds[t.kind],clusters[t.cluster],t.stage,t.format].join(' · ');get('dcTemplateAvailability').textContent=t.page?'Form aplikasi tersedia melalui Tambah dokumen → pilih form.':t.driveUrl?'Buka sumber template / contoh di Drive.':'File unggahan belum ditautkan ke Drive.';const link=get('dcTemplateLink');link.hidden=!t.driveUrl;if(t.driveUrl)link.href=t.driveUrl;else link.removeAttribute('href');get('dcTemplateDialog').showModal();}
  function filters(){const groups={cluster:Object.keys(clusters),kind:Object.keys(kinds),system:[...new Set(templates.map(t=>t.system))],frequency:[...new Set(templates.map(t=>t.frequency))],pic:[...new Set(templates.map(t=>t.pic))]},titles={cluster:'▣ Kluster',kind:'▤ Jenis berkas',system:'⚒ Sistem / barang',frequency:'◷ Rutinitas',pic:'♙ Penanggung jawab'},box=get('dcFilterPanel');box.replaceChildren();Object.entries(groups).forEach(([key,values])=>{const section=node('details',null,'dc-filter-group');section.open=true;section.appendChild(node('summary',titles[key]));values.filter(Boolean).forEach(value=>{const label=node('label'),input=node('input'),caption=node('span',clusters[value]||kinds[value]||value),count=node('small',templates.filter(t=>t[key]===value).length);input.type='checkbox';input.checked=state.filters[key].has(value);input.onchange=()=>{input.checked?state.filters[key].add(value):state.filters[key].delete(value);state.page=1;render();};label.append(input,caption,count);section.appendChild(label);});box.appendChild(section);});get('dcFilterTotal').textContent=Object.values(state.filters).reduce((n,s)=>n+s.size,0);}
  function list(){const box=get('dcList'),items=visibleTemplates(),pages=Math.max(1,Math.ceil(items.length/18));state.page=Math.min(state.page,pages);box.replaceChildren();items.slice((state.page-1)*18,state.page*18).forEach(t=>{const card=node('article',null,'dc-form-card');card.tabIndex=0;card.setAttribute('role','button');card.onclick=()=>openTemplate(t);card.onkeydown=e=>{if(e.key==='Enter'&&e.target===card)openTemplate(t);};card.append(node('small',kinds[t.kind]+' · '+t.code),node('h3','(UTP) '+t.title),node('p',[t.stage,t.system,t.frequency].join(' · ')));const actions=node('div',null,'dc-card-actions');actions.append(button('ⓘ Detail',e=>{e.stopPropagation();openTemplate(t);}));if(t.driveUrl)actions.append(button('↗ Buka berkas',e=>{e.stopPropagation();openLink(t.driveUrl);}));if(t.page)actions.append(button('＋ Form kosong',e=>{e.stopPropagation();newDraft(t.id);}));card.appendChild(actions);box.appendChild(card);});if(!items.length)box.append(node('p','Tidak ada form yang cocok.'));const pager=node('nav',null,'dc-list-pager'),prev=button('← Sebelumnya',()=>{state.page--;list();}),next=button('Berikutnya →',()=>{state.page++;list();});prev.disabled=state.page===1;next.disabled=state.page===pages;pager.append(prev,node('span','Halaman '+state.page+' dari '+pages+' · '+items.length+' form'),next);box.appendChild(pager);}
  function graph(){const box=get('dcGraph');box.replaceChildren();Object.entries(clusters).forEach(([key,title])=>{const items=visibleTemplates().filter(t=>t.cluster===key),section=node('section',null,'dc-cluster');section.dataset.cluster=key;section.append(node('h3',title+' · '+items.length));[...new Set(items.map(t=>t.stage))].forEach(stage=>section.appendChild(button(stage+' ('+items.filter(t=>t.stage===stage).length+')',()=>{state.stage=stage;state.view='list';state.page=1;render();get('dcListView').scrollIntoView({block:'start',behavior:'auto'});},'dc-cluster-node')));box.appendChild(section);});}
  function board(){const box=get('dcBoard');box.replaceChildren();Object.entries(state.board==='status'?statuses:deadlines).forEach(([value,label])=>{const section=node('section',null,'dc-board-column'),items=visibleDocs().filter(d=>(state.board==='status'?d.status:urgency(d.due))===value);section.append(node('h3',label+' · '+items.length));items.forEach(d=>{const card=node('article',null,'dc-board-card');card.draggable=true;card.tabIndex=0;card.append(node('small',projectName(d.projectId)),node('h4',d.title),node('p',deadlines[urgency(d.due)]+' · '+(d.due||'Belum dijadwalkan')),button('▣ Arsip / edit / proses',()=>openRecord(d)));card.onclick=e=>{if(!e.target.closest('button'))openRecord(d);};card.onkeydown=e=>{if(e.key==='Enter'&&e.target===card)openRecord(d);};card.ondragstart=()=>drag=d.id;card.ondragend=()=>drag='';section.appendChild(card);});section.ondragover=e=>e.preventDefault();section.ondrop=e=>{e.preventDefault();const doc=docs.find(d=>d.id===drag);if(!doc)return;if(state.board==='status'){state.pending={doc,target:value,kind:'status'};}else{state.pending={doc,target:value,kind:'deadline'};}get('dcTransitionTitle').textContent='Konfirmasi perpindahan';get('dcTransitionHelp').textContent=doc.title+' → '+label;get('dcTransitionReason').value='';get('dcTransitionDialog').showModal();};box.appendChild(section);});}
  function render(){filters();list();graph();board();root.querySelectorAll('.dc-view').forEach(e=>e.classList.toggle('active',e.id==='dc'+state.view[0].toUpperCase()+state.view.slice(1)+'View'));root.querySelectorAll('[data-dc-view]').forEach(b=>b.classList.toggle('active',b.dataset.dcView===state.view));root.querySelectorAll('[data-dc-quick]').forEach(b=>b.classList.toggle('active',b.dataset.dcQuick===state.quick));root.querySelectorAll('[data-dc-board]').forEach(b=>b.classList.toggle('active',b.dataset.dcBoard===state.board));const chips=get('dcActiveFilters');chips.replaceChildren();if(state.stage)chips.append(button('✕ '+state.stage,()=>{state.stage='';render();}));get('dcSummary').textContent=visibleTemplates().length+' form / referensi · '+visibleDocs().length+' dokumen proyek · '+(loading?'Memuat arsip…':!accessToken?'Masuk data server untuk memuat arsip':'Data server');const reminder=get('dcReminderList');reminder.replaceChildren();visibleDocs().filter(d=>urgency(d.due)!=='NONE'&&d.status!=='SELESAI').sort((a,b)=>String(a.due).localeCompare(String(b.due))).slice(0,5).forEach(d=>reminder.appendChild(button(deadlines[urgency(d.due)]+' · '+d.title,()=>openRecord(d))));}
  async function reload(force=true){if(!accessToken){docs=[];render();return;}if(loading||(!force&&Date.now()-loadedAt<30000))return;const ticket=++epoch,token=accessToken;loading=true;render();try{await window.ProjectWorkspace.ready();const result=await rpc('apiProjects',['documents',{projectId:projectId()},token]);if(ticket!==epoch||token!==accessToken)return;docs=result.documents||[];loadedAt=Date.now();get('dcStatus').textContent=(result.warnings||[]).join(' · ');}catch(e){if(ticket===epoch)get('dcStatus').textContent=e.message;}finally{if(ticket===epoch){loading=false;render();}}}
  function newDraft(id){if(!accessToken){showLoginPanel_('Masuk untuk membuat dokumen.');return;}if(projectId()==='all'){get('dcStatus').textContent='Pilih satu proyek sebelum membuat dokumen.';state.view='board';render();return;}const select=get('dcNewDraftTemplate');select.replaceChildren();templates.forEach(t=>select.add(new Option((t.page?'✎ ':'▤ ')+t.code+' · '+t.title,t.id)));if(id)select.value=id;get('dcNewDraftTitle').value='';get('dcNewDraftDue').value='';get('dcNewDraftDialog').showModal();}
  function openRecord(doc){editing=doc;const form=get('dcRecordForm');get('dcRecordHeading').textContent=doc.title;form.elements.title.value=doc.title;form.elements.due.value=doc.due||'';form.elements.note.value=doc.note||'';const select=form.elements.status;select.replaceChildren();Object.entries(statuses).forEach(([value,label])=>select.add(new Option(label,value)));select.value=doc.status;const local=doc.source==='document';form.elements.title.disabled=!local;['due','note','status'].forEach(k=>form.elements[k].disabled=false);get('dcRecordSave').hidden=get('dcRecordDelete').hidden=false;get('dcRecordDetails').replaceChildren(node('p',projectName(doc.projectId)+' · '+(doc.source||'document')));const history=get('dcRecordHistory');history.replaceChildren();(doc.history||[]).forEach(h=>history.append(node('p',h.at+' · '+h.reason)));const original=doc.record||{};[['Google Sheets',original.spreadsheetUrl||original.sheetUrl],['Excel',original.excelUrl],['PDF',original.pdfUrl],['Folder arsip',original.folderUrl]].forEach(([label,url])=>{if(/^https?:\/\//i.test(url||'')){const a=node('a',label,'btn');a.href=url;a.target='_blank';a.rel='noopener';get('dcRecordDetails').appendChild(a);}});get('dcRecordMessage').textContent=local?'':'Status ini mencatat tracking administrasi. Keputusan approval dan data sumber diedit melalui Buka formulir / arsip.';get('dcRecordDialog').showModal();}
  async function saveDocument(record,action='save'){if(record.source&&record.source!=='document')action=action==='delete'?'hide':'track';const result=await rpc('apiProjectDocument',[action,{record},accessToken]);if(result.conflict)throw new Error('Dokumen berubah di sesi lain. Muat ulang; isian dipertahankan.');await reload();return result.record;}
  get('dcRecordClose').onclick=()=>get('dcRecordDialog').close();get('dcRecordOpen').onclick=()=>{const d=editing,t=templateOf(d);get('dcRecordDialog').close();if(d.source==='document')route(t,d);else if(d.source==='rpb')switchMainPage('RPB');else if(d.source==='rpd'){switchMainPage('RPD');window.RpdWorkspace.openRecord(d.sourceId);}else if(d.source==='memo')switchMainPage('MEMO');else if(d.source==='requests'){switchMainPage('REQUESTS');window.UTPFrontend.openRecord(d.sourceId);}else if(d.source==='approvals'){switchMainPage('APPROVALS');}else{const tool={finance:'Nota/Keuangan',archives:'Arsip Proyek',tasks:'Tugas'}[d.source];if(tool){switchMainPage('TOOLS');if(window.WorkspaceTools&&window.WorkspaceTools.openRecord)window.WorkspaceTools.openRecord(tool,d.sourceId);}else openLink(d.url);}};
  get('dcRecordForm').onsubmit=async e=>{e.preventDefault();const b=get('dcRecordSave');b.disabled=true;try{await saveDocument(Object.assign({},editing,Object.fromEntries(new FormData(e.target))));get('dcRecordDialog').close();}catch(error){get('dcRecordMessage').textContent=error.message;}finally{b.disabled=false;}};
  get('dcRecordDelete').onclick=async()=>{if(!confirm('Hapus kartu dari daftar aktif? File Drive tetap tersimpan.'))return;const b=get('dcRecordDelete');b.disabled=true;try{await saveDocument(editing,'delete');get('dcRecordDialog').close();}catch(e){get('dcRecordMessage').textContent=e.message;}finally{b.disabled=false;}};
  get('dcNewDraftForm').onsubmit=async e=>{e.preventDefault();const t=templates.find(t=>t.id===get('dcNewDraftTemplate').value),b=e.submitter;b.disabled=true;try{await saveDocument({projectId:projectId(),templateId:t.id,title:get('dcNewDraftTitle').value.trim()||t.title,page:t.page||'',memoType:t.memoType||'',due:get('dcNewDraftDue').value,status:'DRAFT'});get('dcNewDraftDialog').close();state.view='board';render();if(t.page)route(t,null,true);}catch(error){get('dcStatus').textContent=error.message;}finally{b.disabled=false;}};
  get('dcTransitionForm').onsubmit=async e=>{e.preventDefault();const pending=state.pending,reason=get('dcTransitionReason').value.trim(),b=e.submitter;if(!pending||!reason)return;b.disabled=true;try{const record=Object.assign({},pending.doc,{note:reason});if(pending.kind==='status')record.status=pending.target;else{if(pending.target==='NONE')record.due='';else{const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value])),date=new Date(parts.year+'-'+parts.month+'-'+parts.day+'T00:00:00Z');date.setUTCDate(date.getUTCDate()+(pending.target==='OVERDUE'?-1:pending.target==='TODAY'?0:Number(pending.target.slice(1))));record.due=date.toISOString().slice(0,10);}}await saveDocument(record);get('dcTransitionDialog').close();state.pending=null;}catch(error){get('dcTransitionHelp').textContent=error.message;}finally{b.disabled=false;}};
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.dcView)state.view=b.dataset.dcView;if(b.dataset.dcBoard)state.board=b.dataset.dcBoard;if(b.dataset.dcQuick){state.quick=b.dataset.dcQuick;state.page=1;}if(b.id==='dcFilterToggle')get('dcFilterPanel').classList.toggle('open');if(b.id==='dcMapReset'){state.stage='';state.page=1;}if(b.id==='dcNewDraft'){newDraft();return;}render();});get('dcSearch').oninput=e=>{state.query=e.target.value.toLocaleLowerCase('id').trim();state.page=1;render();};get('dcProject').setAttribute('data-project-select','');
