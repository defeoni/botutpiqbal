<section id="blank-TOOLS" class="blank-page" hidden><div class="card" style="width:100%;text-align:left"><p class="home-eyebrow">OPERASIONAL PROYEK</p><h2 id="projectToolTitle">Administrasi Proyek</h2><p id="projectToolHelp" class="muted"></p><form id="projectToolForm"><div class="grid"><label>Judul / nama<input id="projectToolName" required maxlength="200"></label><label>Tanggal<input id="projectToolDate" type="date" required></label><label>Status<select id="projectToolStatus"><option>Draf</option><option>Perlu tindak lanjut</option><option>Selesai dicatat</option></select></label><label>Catatan<textarea id="projectToolNote" maxlength="2000"></textarea></label></div><div id="projectToolFields" class="grid"></div><button class="btn primary">Simpan catatan</button><button id="projectToolCancel" type="button" class="btn">Batal edit</button></form><p id="projectToolMessage" role="status"></p><button id="projectToolReload" class="btn" type="button">Muat ulang</button><button id="projectToolImport" class="btn" type="button">Impor draf perangkat</button><label>Cari<input id="projectToolSearch" type="search"></label><div id="projectToolList"></div></div></section>
<script>
(function(){
const modules={'Tugas':'tasks','Nota/Keuangan':'finance','Arsip Proyek':'archives',Absensi:'attendance'},names=Object.keys(modules),get=id=>document.getElementById(id),schemas={Tugas:[['assignee','Penanggung jawab'],['priority','Prioritas','select','Normal,Tinggi,Rendah'],['due','Batas waktu','date']],'Nota/Keuangan':[['reference','Nomor nota'],['vendor','Vendor / penerima'],['amount','Nilai (Rp)','number'],['category','Kategori operasional (bukan material)'],['proof','Referensi bukti']],'Arsip Proyek':[['reference','Nomor dokumen'],['category','Jenis dokumen'],['location','Lokasi / tautan arsip'],['revision','Revisi']],Absensi:[['person','Nama personel'],['attendance','Kehadiran','select','Hadir,Izin,Sakit,Alpa,Libur'],['area','Area kerja'],['hours','Jam kerja','number']]};
schemas.Tugas.push(['documentUrl','Tautan dokumen / arsip terkait','url']);
let current=names[0],editing=null,rows=[],busy=false,dirty=false,opened=false,generation=0,newId=crypto.randomUUID(),newAttachments=[];const message=t=>get('projectToolMessage').textContent=t;
const cache=new Map(),projectId=()=>window.ProjectWorkspace?window.ProjectWorkspace.getActiveId():'',cacheKey=()=>projectId()+':'+modules[current];let pendingRecordId='';
function remember(){cache.set(cacheKey(),{rows:rows.slice(),at:Date.now()});}
function safeUrl(value){try{const url=new URL(String(value||''));return ['https:','http:'].includes(url.protocol)?url.href:'';}catch(error){return '';}}
function link(label,value){const url=safeUrl(value);if(!url)return null;const a=document.createElement('a');a.className='btn';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;return a;}
const detailDialog=document.createElement('dialog');detailDialog.className='dc-dialog';detailDialog.setAttribute('aria-label','Detail dokumen');document.body.appendChild(detailDialog);
function showDetail(record){detailDialog.replaceChildren();const body=document.createElement('div');body.style.padding='24px';const title=document.createElement('h2');title.textContent=record.name;body.appendChild(title);const entries=[['Tanggal',record.date],['Status',record.status],['Sumber',record.source||'Web App'],['Diperbarui',record.updatedAt],['Catatan',record.note]];schemas[current].forEach(([key,label])=>entries.push([label,(record.fields||{})[key]]));entries.forEach(([label,value])=>{if(value!=null&&value!==''){const p=document.createElement('p');p.textContent=label+': '+value;body.appendChild(p);}});const url=(record.fields||{}).location||(record.fields||{}).proof||(record.fields||{}).documentUrl,main=link('↗ Buka berkas',url);if(main)body.appendChild(main);(record.attachments||[]).forEach(file=>{const a=link('↗ '+(file.name||'Lampiran'),file.url);if(a)body.appendChild(a);});if(record.history&&record.history.length){const heading=document.createElement('h3');heading.textContent='Riwayat perubahan';body.appendChild(heading);record.history.forEach(item=>{const p=document.createElement('p');p.textContent=[item.at,item.status,item.reason||item.note].filter(Boolean).join(' · ');body.appendChild(p);});}const close=document.createElement('button');close.type='button';close.className='btn';close.textContent='Tutup';close.onclick=()=>detailDialog.close();body.appendChild(close);detailDialog.appendChild(body);if(!detailDialog.open)detailDialog.showModal();}
function fields(){get('projectToolHelp').textContent=({'Tugas':'Tetapkan penanggung jawab, prioritas, dan batas waktu pekerjaan.','Nota/Keuangan':'Catat biaya operasional dan lampirkan referensi bukti.','Arsip Proyek':'Simpan dokumen, tautan, dan nomor revisi agar mudah ditemukan.','Absensi':'Catat kehadiran personel per tanggal dan area kerja.'})[current];upload.hidden=!['finance','archives'].includes(modules[current]);get('projectToolFields').replaceChildren();schemas[current].forEach(([key,label,type,options])=>{const l=document.createElement('label');l.textContent=label;const input=document.createElement(type==='select'?'select':'input');input.id='tool-'+key;if(type==='select')options.split(',').forEach(value=>{const o=document.createElement('option');o.value=value;o.textContent=value;input.appendChild(o);});else{input.type=type||'text';if(type==='number'){input.min='0';input.step='any';}else input.maxLength=500;}l.appendChild(input);get('projectToolFields').appendChild(l);});}
function clear(){editing=null;dirty=false;newAttachments=[];newId=crypto.randomUUID();get('projectToolForm').reset();get('projectToolDate').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function setBusy(value){busy=value;get('blank-TOOLS').querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=value);render();}
async function work(task){if(busy)return;const ticket=generation;setBusy(true);try{await task(ticket);}catch(e){if(ticket===generation)message(e.message);}finally{if(ticket===generation)setBusy(false);}}
function render(){
  const box=get('projectToolList');box.replaceChildren();const q=get('projectToolSearch').value.toLocaleLowerCase('id'),visible=rows.filter(record=>JSON.stringify(record).toLocaleLowerCase('id').includes(q));
  if(!visible.length)box.textContent=busy?'Memuat / menyimpan…':'Belum ada catatan yang cocok.';
  visible.forEach(record=>{
    const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.textContent=record.name;
    const project=window.ProjectWorkspace&&window.ProjectWorkspace.getProjects().find(p=>p.id===record.projectId);
    const detail=document.createElement('p');detail.textContent=[project&&project.name,record.date,record.status,'Sumber: '+(record.source||'Web App'),record.pendingReview?'Perlu dilengkapi':'',record.note].filter(Boolean).join(' · ');
    const view=document.createElement('button');view.type='button';view.className='btn';view.textContent='▤ Buka detail';view.onclick=()=>showDetail(record);
    const edit=document.createElement('button');edit.type='button';edit.className='btn';edit.textContent='✎ Edit';edit.disabled=busy;
    edit.onclick=()=>{if(dirty&&!confirm('Buang isian yang belum disimpan untuk mengedit catatan ini?'))return;dirty=false;newAttachments=[];editing=record;get('projectToolName').value=record.name;get('projectToolDate').value=record.date;get('projectToolStatus').value=record.status;get('projectToolNote').value=record.note||'';schemas[current].forEach(([key])=>get('tool-'+key).value=record.fields&&record.fields[key]!=null?record.fields[key]:'');message('Mengedit versi '+record.version);editor.open=true;get('projectToolForm').scrollIntoView({block:'start',behavior:'auto'});};
    const remove=document.createElement('button');remove.type='button';remove.className='btn red';remove.textContent='Hapus';remove.disabled=busy;
    remove.onclick=()=>{if(!confirm('Hapus catatan ini dari daftar aktif? Audit dan file Drive tetap disimpan.'))return;work(async ticket=>{const pin=await askDeletePin_('hapus catatan '+current);if(!pin||ticket!==generation)return;const result=await window.workspaceRpc('delete',{module:modules[current],id:record.id,version:record.version,pin});if(ticket!==generation)return;if(result.conflict)throw new Error('Versi berubah. Muat ulang sebelum menghapus.');rows=rows.filter(item=>item.id!==record.id);remember();if(editing&&editing.id===record.id)clear();message(result.warning||'Catatan dihapus dari daftar aktif. File Drive tetap disimpan.');if(window.loadWorkspaceDashboard)window.loadWorkspaceDashboard();document.dispatchEvent(new CustomEvent('utp-record-change'));});};
    card.append(title,detail,view,edit,remove);
    const url=(record.fields||{}).location||(record.fields||{}).proof||(record.fields||{}).documentUrl,open=link(current==='Arsip Proyek'?'↗ Buka arsip':current==='Nota/Keuangan'?'↗ Buka nota / bukti':'↗ Dokumen terkait',url);if(open)card.appendChild(open);
    box.appendChild(card);
  });
}
async function deleteAllCurrent(){const targets=rows.slice(),moduleName=current,moduleKey=modules[current];if(!targets.length){message('Tidak ada catatan aktif yang dimuat untuk dihapus.');return;}if(!confirm('Arsipkan semua '+targets.length+' catatan aktif pada modul '+moduleName+', termasuk yang tersembunyi oleh pencarian? Audit dan file Drive tetap disimpan. Modul lain tidak terpengaruh.'))return;return work(async ticket=>{const pin=await askDeletePin_('hapus semua catatan '+moduleName);if(!pin||ticket!==generation)return;let processed=0;const warnings=[];for(const record of targets){try{const result=await window.workspaceRpc('delete',{module:moduleKey,id:record.id,version:record.version,pin});if(ticket!==generation)return;if(result.conflict)throw new Error('Konflik versi pada '+(record.name||record.id)+'. Muat ulang sebelum melanjutkan.');rows=rows.filter(item=>item.id!==record.id);processed++;if(result.warning)warnings.push(result.warning);if(editing&&editing.id===record.id)clear();}catch(error){render();message('Penghapusan dihentikan: '+processed+' dari '+targets.length+' catatan '+moduleName+' sudah diarsipkan. '+error.message);if(window.loadWorkspaceDashboard)window.loadWorkspaceDashboard();return;}}render();message(processed+' dari '+targets.length+' catatan '+moduleName+' diarsipkan secara lunak. Audit dan file Drive tetap disimpan; modul lain tidak terpengaruh.'+(warnings.length?' Peringatan audit: '+warnings.join(' | '):''));if(window.loadWorkspaceDashboard)window.loadWorkspaceDashboard();});}
async function load(force){if(busy)return;const stored=cache.get(cacheKey());if(!force&&stored&&Date.now()-stored.at<60000){rows=stored.rows.slice();render();message('Daftar tersimpan ditampilkan. Muat ulang untuk mengambil perubahan terbaru.');}else await work(async ticket=>{message('Memuat catatan proyek…');const result=await window.workspaceRpc('list',{module:modules[current]});if(ticket!==generation)return;rows=result.records||[];remember();message(rows.length+' catatan server dimuat.');});if(pendingRecordId){const record=rows.find(r=>r.id===pendingRecordId);pendingRecordId='';if(record)showDetail(record);}}
const deleteAllButton=document.createElement('button');deleteAllButton.id='projectToolDeleteAll';deleteAllButton.type='button';deleteAllButton.className='btn red';deleteAllButton.textContent='Hapus semua pada modul aktif';get('projectToolReload').after(deleteAllButton);deleteAllButton.onclick=deleteAllCurrent;
window.openProjectTool=name=>{if(busy)return false;const next=names.includes(name)?name:names[0];if(opened&&next===current){render();return true;}if(dirty&&!confirm('Isian belum disimpan. Buang perubahan untuk membuka '+next+'?'))return false;opened=true;current=next;generation++;rows=[];get('projectToolTitle').textContent=current;get('projectToolSearch').value='';clear();fields();load();return true;};
get('projectToolForm').addEventListener('input',()=>dirty=true);get('projectToolForm').addEventListener('change',()=>dirty=true);
get('projectToolSearch').oninput=render;get('projectToolCancel').onclick=()=>{if(dirty&&!confirm('Buang isian yang belum disimpan?'))return;clear();message('Edit dibatalkan.');};get('projectToolReload').onclick=()=>{if(editing||dirty){message('Simpan atau batalkan edit dahulu.');return;}load(true);};
get('projectToolForm').onsubmit=e=>{e.preventDefault();const values={};schemas[current].forEach(([k])=>values[k]=get('tool-'+k).value.trim());const record={id:editing?editing.id:newId,version:editing?editing.version:0,projectId:editing&&editing.projectId||projectId(),name:get('projectToolName').value.trim(),date:get('projectToolDate').value,status:get('projectToolStatus').value,note:get('projectToolNote').value.trim(),fields:values,source:editing&&editing.source||'Web App',attachments:(editing&&editing.attachments||[]).concat(newAttachments)};work(async ticket=>{message('Menyimpan…');const result=await window.workspaceRpc('save',{module:modules[current],record});if(ticket!==generation)return;if(result.conflict)throw new Error('Versi server berubah. Isian dipertahankan; batalkan lalu muat ulang untuk membandingkan.');rows=[result.record].concat(rows.filter(r=>r.id!==result.record.id));remember();clear();message(result.warning||'Tersimpan di server.');document.dispatchEvent(new CustomEvent('utp-record-change'));});};
get('projectToolImport').onclick=()=>work(async ticket=>{const drafts=JSON.parse(localStorage.getItem('utp.fe.project.'+current)||'[]');if(!drafts.length){message('Tidak ada draf perangkat.');return;}if(!confirm('Impor '+drafts.length+' draf ke server? Cadangan perangkat tetap ada.'))return;let count=0;for(const draft of drafts){if(ticket!==generation)return;if(rows.some(r=>r.id===draft.id))continue;const result=await window.workspaceRpc('save',{module:modules[current],record:Object.assign({},draft,{version:0})});if(ticket!==generation)return;if(result.conflict)throw new Error('ID sudah ada. Impor dihentikan.');rows.unshift(result.record);count++;}message(count+' draf diimpor.');});
const upload=document.createElement('input');upload.type='file';upload.accept='.pdf,.jpg,.jpeg,.png,.doc,.docx,.xlsx';upload.setAttribute('aria-label','Unggah bukti atau arsip');get('projectToolFields').after(upload);upload.onchange=()=>{const file=upload.files[0],module=modules[current];if(!file)return;if(!['finance','archives'].includes(module)){message('Lampiran tersedia untuk Nota/Keuangan dan Arsip.');return;}work(async ticket=>{if(file.size>5*1024*1024)throw new Error('Ukuran file maksimal 5 MB.');message('Mengunggah…');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('File gagal dibaca.'));reader.readAsDataURL(file);});if(ticket!==generation)return;const result=await window.workspaceRpc('upload',{module,name:file.name,mime:file.type,base64:data});if(ticket!==generation)return;get(module==='finance'?'tool-proof':'tool-location').value=result.url;newAttachments.push({name:result.name||file.name,url:result.url,mime:result.mime||file.type});dirty=true;message('File tersimpan privat. Simpan catatan untuk mengaitkan referensinya.');});};
window.WorkspaceTools={load:()=>load(true),isBusy:()=>busy,isDirty:()=>dirty,openRecord:(name,id)=>{pendingRecordId=id;if(!window.openProjectTool(name)){pendingRecordId='';return false;}const record=rows.find(r=>r.id===id);if(record){pendingRecordId='';showDetail(record);}else if(!busy)load(true);return true;},reset(){generation++;opened=false;rows=[];pendingRecordId='';cache.clear();clear();detailDialog.close();setBusy(false);message('');}};
document.addEventListener('utp-project-change',()=>{generation++;busy=false;rows=[];clear();detailDialog.close();if(opened){setBusy(false);load();}});
document.addEventListener('utp-record-change',()=>cache.clear());
const editor=document.createElement('details'),editorTitle=document.createElement('summary');editorTitle.textContent='＋ Tambah / edit catatan';editor.className='project-tool-editor';get('projectToolForm').before(editor);editor.append(editorTitle,get('projectToolForm'));fields();clear();
})();
</script>
