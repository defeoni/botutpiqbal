<section id="blank-TOOLS" class="blank-page" hidden><div class="card" style="width:100%;text-align:left"><p class="home-eyebrow">OPERASIONAL PROYEK</p><h2 id="projectToolTitle">Administrasi Proyek</h2><p id="projectToolHelp" class="muted"></p><form id="projectToolForm"><div class="grid"><label>Judul / nama<input id="projectToolName" required maxlength="200"></label><label>Tanggal<input id="projectToolDate" type="date" required></label><label>Status<select id="projectToolStatus"><option>Draf</option><option>Perlu tindak lanjut</option><option>Selesai dicatat</option></select></label><label>Catatan<textarea id="projectToolNote" maxlength="2000"></textarea></label></div><div id="projectToolFields" class="grid"></div><button class="btn primary">Simpan catatan</button><button id="projectToolCancel" type="button" class="btn">Batal edit</button></form><p id="projectToolMessage" role="status"></p><button id="projectToolReload" class="btn" type="button">Muat ulang</button><button id="projectToolImport" class="btn" type="button">Impor draf perangkat</button><label>Cari<input id="projectToolSearch" type="search"></label><div id="projectToolList"></div></div></section>
<script>
(function(){
const modules={'Tugas':'tasks','Nota/Keuangan':'finance','Arsip Proyek':'archives',Absensi:'attendance'},names=Object.keys(modules),get=id=>document.getElementById(id),schemas={Tugas:[['assignee','Penanggung jawab'],['priority','Prioritas','select','Normal,Tinggi,Rendah'],['due','Batas waktu','date']],'Nota/Keuangan':[['reference','Nomor nota'],['vendor','Vendor / penerima'],['amount','Nilai (Rp)','number'],['category','Kategori operasional (bukan material)'],['proof','Referensi bukti']],'Arsip Proyek':[['reference','Nomor dokumen'],['category','Jenis dokumen'],['location','Lokasi / tautan arsip'],['revision','Revisi']],Absensi:[['person','Nama personel'],['attendance','Kehadiran','select','Hadir,Izin,Sakit,Alpa,Libur'],['area','Area kerja'],['hours','Jam kerja','number']]};
let current=names[0],editing=null,rows=[],busy=false,dirty=false,opened=false,generation=0,newId=crypto.randomUUID();const message=t=>get('projectToolMessage').textContent=t;
function fields(){get('projectToolHelp').textContent=({'Tugas':'Tetapkan penanggung jawab, prioritas, dan batas waktu pekerjaan.','Nota/Keuangan':'Catat biaya operasional dan lampirkan referensi bukti.','Arsip Proyek':'Simpan dokumen, tautan, dan nomor revisi agar mudah ditemukan.','Absensi':'Catat kehadiran personel per tanggal dan area kerja.'})[current];upload.hidden=!['finance','archives'].includes(modules[current]);get('projectToolFields').replaceChildren();schemas[current].forEach(([key,label,type,options])=>{const l=document.createElement('label');l.textContent=label;const input=document.createElement(type==='select'?'select':'input');input.id='tool-'+key;if(type==='select')options.split(',').forEach(value=>{const o=document.createElement('option');o.value=value;o.textContent=value;input.appendChild(o);});else{input.type=type||'text';if(type==='number'){input.min='0';input.step='any';}else input.maxLength=500;}l.appendChild(input);get('projectToolFields').appendChild(l);});}
function clear(){editing=null;dirty=false;newId=crypto.randomUUID();get('projectToolForm').reset();}
function setBusy(value){busy=value;get('blank-TOOLS').querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=value);render();}
async function work(task){if(busy)return;const ticket=generation;setBusy(true);try{await task(ticket);}catch(e){if(ticket===generation)message(e.message);}finally{if(ticket===generation)setBusy(false);}}
const clearHistory=document.createElement('button');
clearHistory.type='button';clearHistory.className='btn red';clearHistory.textContent='Hapus semua catatan';
get('projectToolReload').after(clearHistory);
clearHistory.onclick=()=>work(async ticket=>{
  const selected=rows.slice(),label=current;
  if(!selected.length){message('Tidak ada catatan yang dapat dihapus.');return;}
  if(!confirm('Hapus seluruh '+selected.length+' catatan '+label+' yang dimuat, termasuk yang tersembunyi oleh pencarian? Catatan hilang dari daftar aktif, tetapi arsip audit dan file Drive dipertahankan. Modul lain tidak dihapus.'))return;
  const pin=await askDeletePin_('hapus semua catatan '+label);
  if(!pin||ticket!==generation)return;
  let count=0;const warnings=[];
  try{
    for(const record of selected){
      if(ticket!==generation)return;
      message('Menghapus '+(count+1)+' dari '+selected.length+' catatan…');
      const result=await window.workspaceRpc('delete',{module:modules[label],id:record.id,version:record.version,pin});
      if(ticket!==generation)return;
      if(result.conflict)throw new Error('Versi catatan berubah. Muat ulang untuk memeriksa sisanya.');
      rows=rows.filter(r=>r.id!==record.id);count++;
      if(editing&&editing.id===record.id)clear();
      if(result.warning)warnings.push(result.warning);
    }
    message(count+' catatan dihapus dari daftar aktif. Arsip audit dan file tetap disimpan.'+(warnings.length?' Peringatan: '+warnings.join(' | '):''));
  }catch(error){throw new Error(count+' dari '+selected.length+' catatan sudah dihapus. Proses berhenti: '+error.message);}
  finally{if(ticket===generation&&window.loadWorkspaceDashboard)window.loadWorkspaceDashboard();}
});
function render(){const box=get('projectToolList');box.replaceChildren();const q=get('projectToolSearch').value.toLowerCase(),visible=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));if(!visible.length)box.textContent=busy?'Memuat / menyimpan…':'Belum ada catatan yang cocok.';visible.forEach(r=>{const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.textContent=r.name;const detail=document.createElement('p');detail.textContent=[r.date,r.status,r.note].concat(schemas[current].map(([k,l])=>r.fields&&r.fields[k]!=null&&r.fields[k]!==''?l+': '+r.fields[k]:'')).filter(Boolean).join(' · ');const edit=document.createElement('button');edit.type='button';edit.className='btn';edit.textContent='Edit';edit.disabled=busy;edit.onclick=()=>{if(dirty&&!confirm('Buang isian yang belum disimpan untuk mengedit catatan ini?'))return;dirty=false;editing=r;get('projectToolName').value=r.name;get('projectToolDate').value=r.date;get('projectToolStatus').value=r.status;get('projectToolNote').value=r.note||'';schemas[current].forEach(([k])=>get('tool-'+k).value=r.fields[k]==null?'':r.fields[k]);message('Mengedit versi '+r.version);};const remove=document.createElement('button');remove.type='button';remove.className='btn red';remove.textContent='Hapus';remove.disabled=busy;remove.onclick=()=>work(async ticket=>{if(!confirm('Hapus catatan '+current+' “'+r.name+'”? Catatan hilang dari daftar aktif; arsip audit dan file Drive tetap disimpan.'))return;const pin=await askDeletePin_('hapus catatan '+current);if(!pin||ticket!==generation)return;const result=await window.workspaceRpc('delete',{module:modules[current],id:r.id,version:r.version,pin});if(ticket!==generation)return;if(result.conflict)throw new Error('Versi berubah. Muat ulang sebelum menghapus.');rows=rows.filter(x=>x.id!==r.id);if(editing&&editing.id===r.id)clear();message(result.warning||'Catatan dihapus dari daftar aktif. Arsip audit dan file tetap disimpan.');if(window.loadWorkspaceDashboard)window.loadWorkspaceDashboard();});card.append(title,detail,edit,remove);box.appendChild(card);});}
async function load(){if(busy)return;await work(async ticket=>{message('Memuat server…');const result=await window.workspaceRpc('list',{module:modules[current]});if(ticket!==generation)return;rows=result.records||[];message(rows.length+' catatan aktif dimuat dari server. Penghapusan memerlukan konfirmasi dan PIN; file Drive tetap disimpan.');});}
window.openProjectTool=name=>{if(busy)return false;const next=names.includes(name)?name:names[0];if(opened&&next===current){render();return true;}if(dirty&&!confirm('Isian belum disimpan. Buang perubahan untuk membuka '+next+'?'))return false;opened=true;current=next;generation++;rows=[];get('projectToolTitle').textContent=current;get('projectToolSearch').value='';clear();fields();load();return true;};
get('projectToolForm').addEventListener('input',()=>dirty=true);get('projectToolForm').addEventListener('change',()=>dirty=true);
get('projectToolSearch').oninput=render;get('projectToolCancel').onclick=()=>{if(dirty&&!confirm('Buang isian yang belum disimpan?'))return;clear();message('Edit dibatalkan.');};get('projectToolReload').onclick=()=>{if(editing||dirty){message('Simpan atau batalkan edit dahulu.');return;}load();};
get('projectToolForm').onsubmit=e=>{e.preventDefault();const values={};schemas[current].forEach(([k])=>values[k]=get('tool-'+k).value.trim());const record={id:editing?editing.id:newId,version:editing?editing.version:0,name:get('projectToolName').value.trim(),date:get('projectToolDate').value,status:get('projectToolStatus').value,note:get('projectToolNote').value.trim(),fields:values};work(async ticket=>{message('Menyimpan…');const result=await window.workspaceRpc('save',{module:modules[current],record});if(ticket!==generation)return;if(result.conflict)throw new Error('Versi server berubah. Isian dipertahankan; batalkan lalu muat ulang untuk membandingkan.');rows=[result.record].concat(rows.filter(r=>r.id!==result.record.id));clear();message(result.warning||'Tersimpan di server.');});};
get('projectToolImport').onclick=()=>work(async ticket=>{const drafts=JSON.parse(localStorage.getItem('utp.fe.project.'+current)||'[]');if(!drafts.length){message('Tidak ada draf perangkat.');return;}if(!confirm('Impor '+drafts.length+' draf ke server? Cadangan perangkat tetap ada.'))return;let count=0;for(const draft of drafts){if(ticket!==generation)return;if(rows.some(r=>r.id===draft.id))continue;const result=await window.workspaceRpc('save',{module:modules[current],record:Object.assign({},draft,{version:0})});if(ticket!==generation)return;if(result.conflict)throw new Error('ID sudah ada. Impor dihentikan.');rows.unshift(result.record);count++;}message(count+' draf diimpor.');});
const upload=document.createElement('input');upload.type='file';upload.accept='.pdf,.jpg,.jpeg,.png,.doc,.docx,.xlsx';upload.setAttribute('aria-label','Unggah bukti atau arsip');get('projectToolFields').after(upload);upload.onchange=()=>{const file=upload.files[0],module=modules[current];if(!file)return;if(!['finance','archives'].includes(module)){message('Lampiran tersedia untuk Nota/Keuangan dan Arsip.');return;}work(async ticket=>{if(file.size>5*1024*1024)throw new Error('Ukuran file maksimal 5 MB.');message('Mengunggah…');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('File gagal dibaca.'));reader.readAsDataURL(file);});if(ticket!==generation)return;const result=await window.workspaceRpc('upload',{module,name:file.name,mime:file.type,base64:data});if(ticket!==generation)return;get(module==='finance'?'tool-proof':'tool-location').value=result.url;dirty=true;message('File tersimpan privat. Simpan catatan untuk mengaitkan referensinya.');});};
window.WorkspaceTools={load,isBusy:()=>busy,reset(){generation++;opened=false;rows=[];clear();setBusy(false);message('');}};fields();
})();
</script>
