<script>
(function(){
  const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e;};
  const rpc=(name,args)=>new Promise((resolve,reject)=>invokeServer(name,args,resolve,reject));
  const date=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-');};
  function field(form,label,name,value,required,type){const wrap=node('label',label),input=node('input');input.name=name;input.type=type||'text';input.value=value||'';input.required=!!required;input.maxLength=500;wrap.appendChild(input);form.appendChild(wrap);return input;}
  function link(box,text,url){if(!/^https:\/\/(?:drive|docs)\.google\.com\//.test(String(url||'')))return;const a=node('a',text,'btn');a.href=url;a.target='_blank';a.rel='noopener noreferrer';box.appendChild(a);}
  function links(box,result){const files=result.files||[{excelUrl:result.excelUrl,downloadUrl:result.downloadUrl,pdfUrl:result.pdfUrl,editableUrl:result.editableUrl}];files.forEach((file,index)=>{const suffix=files.length>1?' · bagian '+(index+1)+' / '+files.length:'';link(box,'Buka Excel'+suffix,file.excelUrl);link(box,'Unduh Excel'+suffix,file.downloadUrl);if(file.editableUrl)link(box,'Google Sheets'+suffix,file.editableUrl);if(file.pdfUrl)link(box,'PDF'+suffix,file.pdfUrl);});link(box,'Folder arsip',result.folderUrl);(result.originals||[]).forEach(r=>link(box,'Bukti asli: '+r.name,r.url));if(result.warning)box.appendChild(node('p',result.warning,'notice'));box.appendChild(node('p','Sumber: '+result.templateName,'muted'));link(box,'Lihat sumber template',result.templateUrl);}
  function dialog(title){const d=node('dialog'),form=node('form');d.className='document-export-dialog';d.style.cssText='max-width:1000px;width:90vw;max-height:90vh;overflow:auto';form.appendChild(node('h2',title));d.appendChild(form);document.body.appendChild(d);const close=node('button','Tutup','btn');close.type='button';close.onclick=()=>d.close();form.appendChild(close);d.addEventListener('close',()=>d.remove(),{once:true});d.showModal();return {d,form,close};}
  async function history(entity,record){
    const token=accessToken,{d,form}=dialog('Arsip ekspor dokumen'),status=node('p','Memuat arsip…'),list=node('div'),nav=node('nav',null,'list-pagination'),retry=node('button','Coba lagi','btn');
    retry.type='button';retry.hidden=true;form.append(status,retry,list,nav);let page=0;
    async function load(){retry.hidden=true;status.textContent='Memuat arsip…';
      try{const rows=await rpc('apiDocumentExportHistory',[entity,record.id,token]);if(!d.isConnected||token!==accessToken)return;
        status.textContent=rows.length?'Setiap ekspor menyimpan salinan data saat dibuat.':'Belum ada ekspor tersimpan.';
        function render(){list.replaceChildren();nav.replaceChildren();rows.slice(page*8,page*8+8).forEach(row=>{const box=node('article',null,'card'),title=entity==='approvalRecap'?'Rekap Approval':row.kind==='initial'?'Permintaan Awal':row.kind==='final'?'Daftar Final':entity==='approvals'?'Draf Approval Material':'RPD';box.appendChild(node('h3',title+(entity==='approvalRecap'?'':' · versi '+row.version)));box.appendChild(node('p',new Date(row.createdAt).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})));links(box,row.outputs);list.appendChild(box);});
          if(rows.length>8){const prev=node('button','Sebelumnya','btn'),next=node('button','Berikutnya','btn');prev.type=next.type='button';prev.disabled=page===0;next.disabled=(page+1)*8>=rows.length;prev.onclick=()=>{page--;render();};next.onclick=()=>{page++;render();};nav.append(prev,node('span',(page*8+1)+'–'+Math.min((page+1)*8,rows.length)+' dari '+rows.length),next);}
        }render();
      }catch(e){if(d.isConnected&&token===accessToken){status.textContent=e.message;retry.hidden=false;}}
    }retry.onclick=load;await load();
  }
  function start(entity,record,kind,context){
    const token=accessToken,snapshot=entity!=='requests'?Object.assign({},record):kind==='initial'?record.initialSnapshot:record.finalSnapshot;
    if(!token||!snapshot)return;if(entity==='approvals')snapshot.items=[{name:record.material}];
    const {d,form,close}=dialog(entity==='approvals'?'Draf form Approval Material':entity==='rpd'?'Ekspor RPD dari template asli':'Ekspor '+(kind==='initial'?'Permintaan Awal':'Daftar Final'));
    form.insertBefore(node('p',entity==='approvals'?'Form F.A1-03B asli. Kolom approval dan tanda tangan tetap kosong untuk proses manual. Ini draf formulir, bukan bukti persetujuan.':entity==='rpd'?'Template Contoh RPD.xlsx. Nomor, akun, PIC dan cara pembayaran diisi sesuai dokumen perusahaan. Tanda tangan tetap diproses manual.':'Format contoh 012. Reques Material JO Santo Yusup.xlsx. Kode JO, tahap, baris, SPP opsional; isi hanya jika sudah ditetapkan. Contoh sumber tidak memiliki logo.','notice'),close);
    const inputs=node('div',null,'grid');form.appendChild(inputs);
    if(entity==='approvals'){field(inputs,'Nama proyek','project','',true);field(inputs,'Lokasi pemasangan','location','',true);field(inputs,'Tanggal dokumen','documentDate',date(),true,'date');}
    if(entity==='rpd'){field(inputs,'Nomor dokumen resmi','number','',true);field(inputs,'Revisi resmi','revision','',true);field(inputs,'Tanggal dokumen','documentDate',date(),true,'date');field(inputs,'No. transaksi (jika ada)','transaction','',false);field(inputs,'Nama pembuat / admin','admin','',true);}
    const details=node('div');form.appendChild(details);
    (entity==='approvals'?[]:snapshot.items).forEach((item,index)=>{const section=node('fieldset'),legend=node('legend',(index+1)+'. '+item.name);section.appendChild(legend);section.className='grid';if(entity==='rpd'){field(section,'Kode akun','account-'+index,'',true);field(section,'PIC','pic-'+index,record.recipient,true);const label=node('label','Pembayaran'),select=node('select');select.name='method-'+index;select.required=true;['','Tunai','Transfer'].forEach(value=>{const option=node('option',value||'Pilih');option.value=value;select.appendChild(option);});label.appendChild(select);section.appendChild(label);field(section,'Waktu kebutuhan','time-'+index,'',false);const bank=field(section,'Bank / rekening tujuan','bank-'+index,record.paymentDetails||'',false);select.onchange=()=>bank.required=select.value==='Transfer';}else{field(section,'Kode JO','jo-'+index,'',false);field(section,'Tahap','stage-'+index,'',false);field(section,'Baris JO','line-'+index,'',false);field(section,'SPP','spp-'+index,'',false);}details.appendChild(section);});
    const status=node('p','Excel mempertahankan format asli. Google Sheets dan PDF dibuat jika struktur sel, tinggi baris dan gambar tetap sesuai. Persetujuan dan tanda tangan diproses manual. Rincian panjang dibagi beberapa file tanpa mengubah format.','notice'),save=node('button','Buat Excel, PDF & arsipkan','btn primary'),resultBox=node('div');save.type='submit';form.append(status,save,resultBox);let busy=false;
    d.addEventListener('cancel',event=>{if(busy)event.preventDefault();});
    form.onsubmit=async event=>{event.preventDefault();if(busy)return;if(token!==accessToken){status.textContent='Sesi berubah. Tutup dialog dan masuk kembali.';return;}if(entity==='requests'){const state=window.UTPFrontend&&window.UTPFrontend.getState(),editor=state&&state.editor;if(!editor||editor.record.id!==record.id||editor.record.version!==record.version||editor.dirty){status.textContent='Permintaan berubah. Simpan dahulu lalu buka ekspor kembali.';return;}}
      const values=new FormData(form),options={};if(entity==='approvals')['project','location','documentDate'].forEach(k=>options[k]=values.get(k));if(entity==='rpd')['number','revision','documentDate','transaction','admin'].forEach(k=>options[k]=values.get(k));options.items=snapshot.items.map((item,index)=>{const r={};(entity==='rpd'?['account','pic','method','time','bank']:['jo','stage','line','spp']).forEach(k=>r[k]=values.get(k+'-'+index));return r;});
      busy=true;form.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);status.textContent='Membuat salinan template dan menyimpan arsip…';
      try{const result=await rpc('apiDocumentExport',[entity,record.id,record.version,kind,token,options]);if(!d.isConnected||token!==accessToken)return;resultBox.replaceChildren();links(resultBox,result);status.textContent='Excel tersimpan. Sumber template dan bukti asli tetap utuh.';}catch(e){if(d.isConnected&&token===accessToken)status.textContent=e.message;}finally{busy=false;if(d.isConnected){form.querySelectorAll('button,input,select').forEach(e=>e.disabled=false);}}
    };
  }
  function actions(entity,record,context){const box=node('div',null,'utp-actions document-export-actions'),ctx=context||{},preview=ctx.preview||window.UTP_FRONTEND_PREVIEW===true;let reason=preview?'Ekspor arsip tersedia setelah masuk aplikasi server.':ctx.dirty?'Simpan perubahan sebelum ekspor.':!record.version?'Simpan dokumen dahulu.':ctx.busy?'Tunggu penyimpanan selesai.':'';
    const add=(title,kind,available)=>{const b=node('button',title,'btn');b.type='button';b.disabled=!!reason||!available;b.title=reason||(!available?'Dokumen belum ditetapkan.':'');b.onclick=()=>start(entity,record,kind,ctx);box.appendChild(b);};
    if(entity==='approvals'){add('Ekspor draf F.A1-03B','draft',true);link(box,'Contoh pengajuan approval lengkap','https://drive.google.com/file/d/1i8I9S6XGVb9cOopPrXrYRlm0P_kkiSqU/view');link(box,'Form rekap approval asli','https://drive.google.com/file/d/1AvsaZoLwyolQggvIDQZJKk7fjcAMtolK/view');}else if(entity==='rpd')add('Ekspor RPD','draft',true);else{add('Ekspor permintaan awal','initial',!!record.initialSnapshot);add('Ekspor daftar final','final',!!record.finalSnapshot&&(record.status==='FINAL'||record.arrived));}
    const old=node('button','Arsip ekspor','btn');old.type='button';old.disabled=preview||!record.version||ctx.busy;old.onclick=()=>history(entity,record);box.appendChild(old);if(reason)box.appendChild(node('span',reason,'muted'));return box;
  }
  function recap(){
    const token=accessToken;if(!token||window.UTP_FRONTEND_PREVIEW===true)return;
    const {d,form}=dialog('Ekspor rekap approval · F.A1-03A');const archives=node('button','Riwayat rekap','btn');archives.type='button';archives.onclick=()=>history('approvalRecap',{id:'all'});form.appendChild(archives);
    form.appendChild(node('p','Mencakup semua approval aktif di server, termasuk di luar filter atau halaman saat ini. Sepuluh catatan per bagian. Status disalin sesuai otoritas; tidak menciptakan persetujuan. Tanggal berikut untuk arsip, bukan tanggal pengajuan.','notice'));
    field(form,'Nama proyek','project','',true);field(form,'Tanggal arsip','documentDate',date(),true,'date');
    const button=node('button','Buat Excel & arsipkan','btn primary'),status=node('p'),resultBox=node('div');button.type='submit';form.append(button,status,resultBox);let busy=false;
    d.addEventListener('cancel',event=>{if(busy)event.preventDefault();});
    form.onsubmit=async event=>{event.preventDefault();if(busy)return;if(token!==accessToken){status.textContent='Sesi berubah. Tutup dialog lalu masuk kembali.';return;}const values=new FormData(form),options={project:values.get('project'),documentDate:values.get('documentDate')};busy=true;form.querySelectorAll('button,input').forEach(e=>e.disabled=true);status.textContent='Membuat rekap dari template asli…';
      try{const result=await rpc('apiDocumentExport',['approvalRecap','all',0,'draft',token,options]);if(d.isConnected&&token===accessToken){resultBox.replaceChildren();links(resultBox,result);status.textContent='Rekap tersimpan. Keputusan sumber tidak diubah.';}}
      catch(e){if(d.isConnected&&token===accessToken)status.textContent=e.message;}
      finally{busy=false;if(d.isConnected)form.querySelectorAll('button,input').forEach(e=>e.disabled=false);}
    };
  }
  window.DocumentExports={recap,approval:(record,context)=>actions('approvals',record,context),material:(record,context)=>actions('requests',record,context),rpd:(record,context)=>actions('rpd',record,context)};
})();
</script>
