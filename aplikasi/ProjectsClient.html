<dialog id="projectIdentityDialog" class="dc-dialog"><form id="projectIdentityForm"><h2>Identitas proyek</h2><div class="grid" id="projectIdentityFields"></div><p id="projectIdentityStatus" role="status"></p><menu><button type="button" class="btn" id="projectIdentityCancel">Batal</button><button class="btn primary">Simpan proyek</button></menu></form></dialog>
<script>
(function(){
  const get=id=>document.getElementById(id),legacy={id:'legacy',name:'Data lama — belum dipetakan',code:'LEGACY'},rpc=(action,payload)=>new Promise((resolve,reject)=>invokeServer('apiProjects',[action,payload||{},accessToken],resolve,reject));
  let projects=[],active='all',editing=null,loaded=false,session='',loading=null,generation=0;
  const fields={name:'Nama proyek',code:'Kode proyek',pm:'Project Manager (PM)',mk:'Manajemen Konstruksi (MK)',owner:'Owner / klien',location:'Lokasi',start:'Mulai proyek',end:'Selesai proyek',note:'Catatan tambahan'};
  function options(select){const value=active;select.replaceChildren();[{id:'all',name:'Semua proyek'},...projects,legacy].forEach(p=>select.add(new Option(p.name,p.id)));select.value=value;}
  function render(){document.querySelectorAll('[data-project-select]').forEach(options);const p=projects.find(r=>r.id===active)||(active==='legacy'?legacy:null);document.querySelectorAll('[data-project-name]').forEach(e=>e.textContent=p?p.name:'Semua proyek');document.querySelectorAll('[data-project-code]').forEach(e=>e.textContent=p?p.code:'Rekap lintas proyek');document.querySelectorAll('[data-project-pm]').forEach(e=>e.textContent=p&&p.pm?'PM: '+p.pm:'Pilih proyek untuk melihat identitas');}
  async function ready(){if(!accessToken){render();return;}if(loaded&&session===accessToken)return;if(loading)return loading;session=accessToken;const token=session,ticket=generation;loading=rpc('list').then(result=>{if(token!==accessToken||ticket!==generation)return;projects=result.projects||[];loaded=true;window.UTP_PIN_DEFERRED=result.pinDeferred===true;render();}).catch(e=>{if(ticket===generation)get('projectScopeStatus').textContent=e.message;}).finally(()=>{if(ticket===generation)loading=null;});return loading;}
  function select(id){if(id===active){render();return;}if(window.WorkspaceTools&&window.WorkspaceTools.isBusy()||window.RpdWorkspace&&window.RpdWorkspace.isBusy()){get('projectScopeStatus').textContent='Tunggu penyimpanan selesai sebelum pindah proyek.';render();return;}if((window.WorkspaceTools&&window.WorkspaceTools.isDirty()||window.RpdWorkspace&&window.RpdWorkspace.isDirty()||window.UTP_SCOPE_DIRTY)&&!confirm('Pindah proyek dan tutup isian yang belum disimpan?')){render();return;}active=id;window.UTP_SCOPE_DIRTY=false;render();document.dispatchEvent(new CustomEvent('utp-project-change',{detail:{projectId:active}}));}
  function edit(record){editing=record||null;const box=get('projectIdentityFields');box.replaceChildren();Object.entries(fields).forEach(([key,title])=>{const label=document.createElement('label'),input=document.createElement(key==='note'?'textarea':'input');label.textContent=title;input.name=key;input.value=record&&record[key]||'';input.maxLength=key==='note'?2000:200;if(key==='start'||key==='end')input.type='date';input.required=key==='name'||key==='code';label.appendChild(input);box.appendChild(label);});get('projectIdentityStatus').textContent='';get('projectIdentityDialog').showModal();}
  get('projectIdentityCancel').onclick=()=>get('projectIdentityDialog').close();
  get('projectIdentityForm').onsubmit=async event=>{event.preventDefault();if(!accessToken){get('projectIdentityStatus').textContent='Masuk data server dahulu.';return;}const record=Object.fromEntries(new FormData(event.target));if(editing){record.id=editing.id;record.version=editing.version;}const button=event.submitter;button.disabled=true;try{const result=await rpc('save',{record});if(result.conflict)throw new Error('Identitas berubah di sesi lain. Muat ulang sebelum menyimpan.');projects=[result.record,...projects.filter(p=>p.id!==result.record.id)];get('projectIdentityDialog').close();select(result.record.id);}catch(e){get('projectIdentityStatus').textContent=e.message;}finally{button.disabled=false;}};
  document.addEventListener('change',event=>{if(event.target.matches('[data-project-select]'))select(event.target.value);});
  document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.hasAttribute('data-project-add'))edit();if(button.hasAttribute('data-project-edit')){const p=projects.find(r=>r.id===active);if(p)edit(p);else get('projectScopeStatus').textContent='Pilih satu proyek untuk mengedit identitasnya.';}});
  window.ProjectWorkspace={ready,getActiveId:()=>active,getActive:()=>projects.find(p=>p.id===active)||null,getProjects:()=>projects.slice(),select,reset(){generation++;loading=null;projects=[];loaded=false;session='';active='all';render();}};
  render();
})();
</script>
