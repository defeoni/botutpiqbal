<section id="blank-RPD" class="card blank-page" hidden><div style="width:100%;text-align:left"><h2>Rencana Pengeluaran Dana</h2><p class="notice">Rencana dana operasional, bukan pembelian material. Status pengajuan adalah catatan admin; tidak mengirim atau menyetujui pembayaran.</p><form id="rpdForm"><div class="grid"><label>Keperluan<input id="rpdPurpose" required maxlength="200"></label><label>Tanggal kebutuhan<input id="rpdDate" type="date" required></label><label>Penerima<input id="rpdRecipient" required maxlength="200"></label><label>Detail penerima / rekening<input id="rpdPayment" maxlength="500"></label><label>Referensi invoice / kwitansi<input id="rpdProof" maxlength="500"></label><label>Status<select id="rpdState"><option value="DRAFT">Draf</option><option value="SUBMITTED">Sudah diajukan manual</option></select></label><label>Catatan<textarea id="rpdNote" maxlength="2000"></textarea></label></div><div class="tablewrap"><table><thead><tr><th>Uraian</th><th>Jumlah</th><th>Harga satuan</th><th>Subtotal</th><th>Aksi</th></tr></thead><tbody id="rpdLines"></tbody></table></div><button id="rpdAdd" type="button" class="btn">Tambah baris</button><p id="rpdTotal"></p><p id="rpdReminder"></p><button class="btn primary">Simpan RPD</button><button id="rpdCancel" type="button" class="btn">Batal edit / baru</button></form><p id="rpdStatus" role="status"></p><h2>RPD tersimpan</h2><button id="rpdReload" type="button" class="btn">Muat ulang</button><button id="rpdImport" type="button" class="btn">Impor draf perangkat</button><label>Cari<input id="rpdSearch" type="search"></label><div id="rpdHistory"></div></div></section>
<script>
(function(){const get=id=>document.getElementById(id);let rows=[],editing=null,busy=false,dirty=false,generation=0,newId=crypto.randomUUID(),pendingId='';const message=t=>get('rpdStatus').textContent=t;
const cache=new Map(),projectId=()=>window.ProjectWorkspace?window.ProjectWorkspace.getActiveId():'all',key=()=>String(typeof accessToken==='string'?accessToken:'')+':'+projectId();
function today(){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value]));return parts.year+'-'+parts.month+'-'+parts.day;}
function validProject(){if(projectId()==='all'){message('Pilih satu proyek sebelum membuat atau menyimpan RPD.');return false;}return true;}
function editRecord(record){if(busy)return false;if(dirty&&!confirm('Tutup isian RPD yang belum disimpan untuk membuka dokumen ini?'))return false;editing=record;dirty=false;get('rpdPurpose').value=record.purpose;get('rpdDate').value=record.date;get('rpdRecipient').value=record.recipient;get('rpdPayment').value=record.paymentDetails||'';get('rpdProof').value=record.proof||'';get('rpdState').value=record.status;get('rpdNote').value=record.note||'';get('rpdLines').replaceChildren();record.items.forEach(add);reminder();message('Mengedit versi '+record.version);get('rpdForm').scrollIntoView({block:'start',behavior:'auto'});return true;}
function total(){let sum=0;get('rpdLines').querySelectorAll('tr').forEach(r=>{const n=Math.round(Number(r.children[1].firstChild.value)*Number(r.children[2].firstChild.value)*100)/100;r.children[3].textContent=n.toLocaleString('id-ID');sum+=n;});get('rpdTotal').textContent='Total Rp '+sum.toLocaleString('id-ID');return sum;}
function add(item){const tr=document.createElement('tr');['text','number','number'].forEach((type,i)=>{const td=document.createElement('td'),input=document.createElement('input');input.type=type;input.required=true;if(i){input.min=i===1?'0.01':'0';input.step='any';}else input.maxLength=300;input.value=item?[item.name,item.quantity,item.price][i]:i===1?'1':i===2?'0':'';td.appendChild(input);tr.appendChild(td);});tr.appendChild(document.createElement('td'));const td=document.createElement('td'),b=document.createElement('button');b.type='button';b.textContent='Hapus';b.onclick=()=>{tr.remove();total();};td.appendChild(b);tr.appendChild(td);tr.oninput=total;get('rpdLines').appendChild(tr);total();}
function clear(){editing=null;dirty=false;newId=crypto.randomUUID();get('rpdForm').reset();get('rpdDate').value=today();get('rpdLines').replaceChildren();add();reminder();}
function reminder(){const date=get('rpdDate').value;if(!date){get('rpdReminder').textContent='';return;}const d=new Date(date+'T00:00:00+07:00');d.setUTCDate(d.getUTCDate()-2);get('rpdReminder').textContent='Siapkan pengajuan paling lambat H-2: '+new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium'}).format(d)+'. Pengingat ini tampil di halaman.';}
function setBusy(v){busy=v;get('blank-RPD').querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=v);history();}
async function work(fn){if(busy)return;const ticket=generation;cache.delete(key());setBusy(true);try{await fn(ticket);}catch(e){if(ticket===generation)message(e.message);}finally{if(ticket===generation)setBusy(false);}}
function history(){
  const box=get('rpdHistory');box.replaceChildren();const q=get('rpdSearch').value.toLocaleLowerCase('id'),visible=rows.filter(r=>JSON.stringify(r).toLocaleLowerCase('id').includes(q));
  if(!visible.length)box.textContent=busy?'Memuat / menyimpan…':'Belum ada RPD yang cocok.';
  visible.forEach(record=>{
    const card=document.createElement('article');card.className='card';const text=document.createElement('p');
    const project=window.ProjectWorkspace&&window.ProjectWorkspace.getProjects().find(p=>p.id===record.projectId);
    text.textContent=[project?project.name:record.projectId==='legacy'||!record.projectId?'Data lama — belum dipetakan':'',record.date,record.purpose,record.recipient,record.status,'Rp '+Number(record.total||0).toLocaleString('id-ID')].filter(Boolean).join(' · ');
    const detail=document.createElement('pre');detail.textContent=(record.items||[]).map(item=>item.name+' · '+item.quantity+' × '+item.price).join('\n')+'\n'+(record.note||'');
    const edit=document.createElement('button');edit.type='button';edit.className='btn';edit.textContent='✎ Buka / edit';edit.disabled=busy;edit.onclick=()=>editRecord(record);
    const remove=document.createElement('button');remove.type='button';remove.className='btn red';remove.textContent='Hapus';remove.disabled=busy;
    remove.onclick=()=>{if(!confirm('Hapus RPD ini dari daftar aktif? Audit dan file Drive tetap disimpan.'))return;work(async ticket=>{const pin=await askDeletePin_('hapus RPD');if(!pin||ticket!==generation)return;const result=await window.workspaceRpc('delete',{module:'rpd',id:record.id,version:record.version,pin});if(ticket!==generation)return;if(result.conflict)throw new Error('Versi berubah. Muat ulang dahulu; tidak ada penghapusan.');rows=rows.filter(r=>r.id!==record.id);if(editing&&editing.id===record.id)clear();message(result.warning||'RPD dihapus dari daftar aktif. File Drive tetap disimpan.');document.dispatchEvent(new CustomEvent('utp-record-change'));if(window.loadWorkspaceDashboard)window.loadWorkspaceDashboard();});};
    card.append(text,detail,edit,remove);if(window.DocumentExports)card.appendChild(window.DocumentExports.rpd(record,{busy}));box.appendChild(card);
  });
  const count=get('hoRpdCount');if(count)count.textContent=rows.length;
}
async function deleteAll(){const targets=rows.slice();if(!targets.length){message('Tidak ada RPD aktif yang dimuat untuk dihapus.');return;}if(!confirm('Hapus semua '+targets.length+' RPD aktif yang dimuat, termasuk yang tersembunyi oleh pencarian? Data akan diarsipkan secara lunak; audit dan file Drive tetap disimpan. Modul lain tidak terpengaruh.'))return;return work(async ticket=>{const pin=await askDeletePin_('hapus semua RPD aktif');if(!pin||ticket!==generation)return;let processed=0;const warnings=[];for(const record of targets){try{const result=await window.workspaceRpc('delete',{module:'rpd',id:record.id,version:record.version,pin});if(ticket!==generation)return;if(result.conflict)throw new Error('Konflik versi pada '+(record.purpose||record.id)+'. Muat ulang data tersebut.');rows=rows.filter(item=>item.id!==record.id);processed++;if(result.warning)warnings.push(result.warning);if(editing&&editing.id===record.id)clear();}catch(error){history();message('Penghapusan dihentikan: '+processed+' dari '+targets.length+' RPD sudah dihapus. '+error.message);if(window.loadWorkspaceDashboard)window.loadWorkspaceDashboard();return;}}history();message(processed+' dari '+targets.length+' RPD diarsipkan secara lunak. Audit dan file Drive tetap disimpan; modul lain tidak terpengaruh.'+(warnings.length?' Peringatan audit: '+warnings.join(' | '):''));if(window.loadWorkspaceDashboard)window.loadWorkspaceDashboard();});}
async function load(force){if(busy)return;const stored=cache.get(key());if(!force&&stored&&Date.now()-stored.at<30000){rows=stored.rows.slice();history();message('RPD tersimpan ditampilkan. Muat ulang untuk mengambil perubahan terbaru.');}else await work(async ticket=>{message('Memuat RPD server…');const result=await window.workspaceRpc('list',{module:'rpd'});if(ticket!==generation)return;rows=result.records||[];cache.set(key(),{rows:rows.slice(),at:Date.now()});message('RPD server dimuat.');});if(pendingId){const record=rows.find(r=>r.id===pendingId);pendingId='';if(record)editRecord(record);else message('RPD tidak ditemukan pada proyek aktif. Muat ulang atau pilih proyek asal.');}}
const deleteAllButton=document.createElement('button');deleteAllButton.id='rpdDeleteAll';deleteAllButton.type='button';deleteAllButton.className='btn red';deleteAllButton.textContent='Hapus semua RPD aktif';get('rpdReload').after(deleteAllButton);deleteAllButton.onclick=deleteAll;
get('rpdForm').onsubmit=e=>{e.preventDefault();if(!editing&&!validProject())return;const record={id:editing?editing.id:newId,version:editing?editing.version:0,projectId:editing?editing.projectId||'legacy':projectId(),workspaceDocumentId:editing?editing.workspaceDocumentId||'':window.UTP_PENDING_DOCUMENT_ID||'',purpose:get('rpdPurpose').value.trim(),date:get('rpdDate').value,recipient:get('rpdRecipient').value.trim(),paymentDetails:get('rpdPayment').value.trim(),proof:get('rpdProof').value.trim(),status:get('rpdState').value,note:get('rpdNote').value.trim(),items:Array.from(get('rpdLines').rows).map(r=>({name:r.children[0].firstChild.value.trim(),quantity:Number(r.children[1].firstChild.value),price:Number(r.children[2].firstChild.value)}))};work(async ticket=>{let pin;const protectedChange=record.status==='SUBMITTED'||editing&&editing.status==='SUBMITTED';if(protectedChange)pin=await askDeletePin_('catat atau ubah pengajuan RPD');if(protectedChange&&!pin)return;if(ticket!==generation)return;message('Menyimpan RPD…');const result=await window.workspaceRpc('save',{module:'rpd',record,pin});if(ticket!==generation)return;if(result.conflict)throw new Error('Versi server berubah. Isian dipertahankan; batalkan edit lalu muat ulang untuk membandingkan.');rows=[result.record].concat(rows.filter(r=>r.id!==result.record.id));window.UTP_PENDING_DOCUMENT_ID='';clear();message(result.warning||'RPD tersimpan di server.');document.dispatchEvent(new CustomEvent('utp-record-change'));});};
get('rpdForm').addEventListener('input',()=>dirty=true);get('rpdForm').addEventListener('change',()=>dirty=true);
get('rpdAdd').onclick=()=>{add();dirty=true;};get('rpdCancel').onclick=()=>window.RpdWorkspace.createBlank();get('rpdDate').onchange=reminder;get('rpdSearch').oninput=history;get('rpdReload').onclick=()=>{if(editing||dirty){message('Simpan atau batalkan edit dahulu.');return;}load(true);};
get('rpdImport').onclick=()=>{if(!validProject())return;if(dirty&&!confirm('Ganti isian RPD yang belum disimpan dengan draf perangkat?'))return;work(async ticket=>{const drafts=JSON.parse(localStorage.getItem('utp.fe.rpd')||'[]');if(!drafts.length){message('Tidak ada draf perangkat.');return;}if(!confirm('Impor draf RPD perangkat ke proyek aktif? Cadangan tetap ada.'))return;const draft=drafts.find(d=>!rows.some(r=>r.id===d.id));if(!draft){message('Seluruh ID draf sudah ada.');return;}editing={id:draft.id,version:0,status:'DRAFT',projectId:projectId()};get('rpdPurpose').value=draft.purpose;get('rpdDate').value=draft.date;get('rpdRecipient').value=draft.recipient||'';get('rpdPayment').value=draft.paymentDetails||'';get('rpdProof').value=draft.proof||'';get('rpdState').value='DRAFT';get('rpdNote').value=draft.note||'';get('rpdLines').replaceChildren();(draft.items||[]).forEach(add);dirty=true;reminder();message('Draf perangkat dimuat ke formulir. Lengkapi lalu simpan ke server.');});};
const upload=document.createElement('input');upload.type='file';upload.accept='.pdf,.jpg,.jpeg,.png,.doc,.docx,.xlsx';upload.setAttribute('aria-label','Unggah invoice atau kwitansi');get('rpdProof').parentElement.appendChild(upload);upload.onchange=()=>{const file=upload.files[0];if(!file)return;work(async ticket=>{if(file.size>5*1024*1024)throw new Error('Ukuran file maksimal 5 MB.');message('Mengunggah bukti…');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('File gagal dibaca.'));reader.readAsDataURL(file);});if(ticket!==generation)return;const result=await window.workspaceRpc('upload',{module:'rpd',name:file.name,mime:file.type,base64:data});if(ticket!==generation)return;get('rpdProof').value=result.url;message('Bukti tersimpan privat. Simpan RPD untuk mengaitkan referensinya.');});};
get('rpdLines').addEventListener('click',event=>{if(event.target.closest('button'))dirty=true;});
window.RpdWorkspace={load:()=>load(),isDirty:()=>dirty,isBusy:()=>busy,createBlank(){if(busy)return false;if(!validProject())return false;if(dirty&&!confirm('Tutup isian RPD yang belum disimpan dan buat form kosong?'))return false;clear();message('Form RPD baru untuk proyek aktif.');return true;},openRecord(id){pendingId=id;const record=rows.find(r=>r.id===id);if(record&&!busy){pendingId='';return editRecord(record);}if(!busy)load(true);return true;},reset(){generation++;rows=[];pendingId='';cache.clear();clear();setBusy(false);message('');}};
document.addEventListener('utp-project-change',()=>{generation++;busy=false;rows=[];pendingId='';clear();setBusy(false);message('');if(!get('blank-RPD').hidden)load();});
document.addEventListener('utp-record-change',()=>cache.clear());clear();
})();
</script>
