<style>
:root{--blue:#1d4ed8;--navy:#1e3a8a;--bg:#f1f5f9;--line:#cbd5e1;--ink:#0f172a}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Arial,sans-serif;padding:16px}
main{max-width:1100px;margin:auto}.header,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
h1{font-size:21px;color:var(--navy);margin:0 0 4px}h2{font-size:16px;margin:0 0 14px;color:var(--navy)}
.muted{color:#64748b;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--line);border-radius:7px;padding:10px 13px;background:#e2e8f0;cursor:pointer;font-weight:700;color:#334155}
.tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,select{width:100%;padding:9px;border:1px solid #94a3b8;border-radius:6px;background:#fff;font:inherit}
.date-input{min-height:44px;min-width:190px;padding:10px 12px;font-size:15px;cursor:pointer}
.field{margin-bottom:12px}.section[hidden],#common[hidden],#result[hidden],#loading[hidden]{display:none!important}
.tablewrap{overflow:auto;overscroll-behavior-x:contain}table{width:100%;border-collapse:collapse;min-width:760px}th,td{border:1px solid var(--line);padding:7px;text-align:left;vertical-align:middle}th{background:#e2e8f0}td input{min-width:95px}
#tablePN,#tablePGOut,#tablePGIn,#tableSP{min-width:1120px}
#tablePN th,#tablePN td,#tablePGOut th,#tablePGOut td,#tablePGIn th,#tablePGIn td,#tableSP th,#tableSP td{text-align:center}
#tablePN td input:not([type=file]),#tablePGOut td input:not([type=file]),#tablePGIn td input:not([type=file]),#tableSP td input:not([type=file]){text-align:center}
#tablePN th:last-child,#tablePN td:last-child,#tablePGOut th:last-child,#tablePGOut td:last-child,#tablePGIn th:last-child,#tablePGIn td:last-child,#tableSP th:last-child,#tableSP td:last-child{position:sticky;right:0;z-index:2;background:#fff;min-width:100px}
#tablePN th:last-child,#tablePGOut th:last-child,#tablePGIn th:last-child,#tableSP th:last-child{background:#e2e8f0;z-index:3}
.output-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px;align-items:stretch}
.output-choice{display:flex;align-items:center;gap:12px;min-height:58px;margin:0;padding:13px 15px;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;font-size:15px;font-weight:700;cursor:pointer}
.output-choice:hover{border-color:#93c5fd;background:#eff6ff}
.output-choice input[type=checkbox]{width:21px;height:21px;margin:0;flex:0 0 auto;accent-color:var(--blue)}
.output-recipient{align-self:stretch;margin:0}
.memo-history-list{display:grid;gap:14px}
.memo-history-card{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;padding:15px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.memo-history-preview{display:block;position:relative;overflow:hidden;min-height:140px;border:1px solid #dbe3ef;border-radius:8px;background:#f1f5f9;text-decoration:none}
.memo-history-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.memo-history-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#1e3a8a;font-weight:800;font-size:22px;background:linear-gradient(135deg,#eff6ff,#dbeafe)}
.memo-history-details{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px}
.memo-history-details h3{font-size:16px;color:var(--navy);margin:0;overflow-wrap:anywhere}
.memo-history-meta{color:#475569;font-size:13px}
.memo-history-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.memo-history-actions .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin:0}
.memo-history-files{font-size:12px;color:#64748b;overflow-wrap:anywhere}
.history-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
.history-pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.history-pagination .btn{margin:0}
.pin-dialog{width:min(420px,calc(100% - 28px));border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 20px 60px rgba(15,23,42,.24)}
.pin-dialog::backdrop{background:rgba(15,23,42,.48)}
.pin-dialog h2{margin-bottom:8px}
.pin-dialog input{margin:0 0 8px;letter-spacing:.3em;font-size:20px}
.pin-dialog .actions{justify-content:flex-end;margin-top:12px}
button{font:inherit}.btn{border:0;border-radius:6px;padding:10px 14px;background:#64748b;color:white;font-weight:700;cursor:pointer;margin:3px 3px 3px 0}
.btn.primary{background:var(--blue)}.btn.green{background:#15803d}.btn.red{background:#b91c1c}.btn:disabled{opacity:.55;cursor:wait}
.actions{display:flex;flex-wrap:wrap;gap:7px}.notice{padding:12px;border-radius:7px;background:#eff6ff;margin:12px 0}.result{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:16px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid var(--line);border-radius:6px;padding:12px}
.error{color:#b91c1c;white-space:pre-wrap}
.app-status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.app-status-row p{margin:0;overflow-wrap:anywhere}
.app-status-row .error{font-weight:700}
.main-nav{display:flex;gap:10px;margin:14px 0}.main-nav .tab{flex:1;text-align:center}
.identity{margin-left:auto;font-weight:700;color:var(--navy);align-self:center}
.subnav{border-bottom:1px solid var(--line);padding-bottom:12px}
.roster-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.blank-page{min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center}
.ktp-help{min-width:190px}.ktp-cell input[type=file]{font-size:12px}
@media(max-width:600px){body{padding:8px}.header,.panel,.card{padding:13px}.main-nav{gap:5px}.main-nav .tab{padding:10px 5px}.output-grid{grid-template-columns:1fr}.output-choice{min-height:56px}}
@media(max-width:620px){.memo-history-card{grid-template-columns:1fr}.memo-history-preview{min-height:190px}.memo-history-actions .btn{flex:1 1 135px}}
@media(max-width:520px){.app-status-row{align-items:stretch;flex-direction:column}.app-status-row .btn{margin:0}}
</style>
