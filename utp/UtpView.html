<section id="utpApp" class="utp" hidden aria-label="Administrasi proyek">
  <div id="utpBanner" class="utp-banner" hidden></div>
  <div id="utpContent" aria-live="polite"></div>
</section>
<dialog id="utpDialog" class="utp-dialog" aria-labelledby="utpDialogTitle">
  <form id="utpForm">
    <div class="utp-dialog-head"><div><span class="utp-eyebrow">TERRASENTRA · BANDUNG</span><h2 id="utpDialogTitle"></h2></div><button type="button" class="utp-icon-button" id="utpCloseDialog" aria-label="Tutup formulir">×</button></div>
    <div id="utpFields"></div>
    <p id="utpFormError" class="error" role="alert"></p>
    <div class="utp-dialog-foot"><span class="muted">Data tersimpan untuk proyek aktif.</span><div><button type="button" class="btn" id="utpCancelDialog">Batal</button><button type="submit" class="btn primary" id="utpSave">Simpan</button></div></div>
  </form>
</dialog>
<div id="utpToast" class="utp-toast" role="status" hidden></div>
